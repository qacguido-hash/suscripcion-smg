<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --fg:#ECEEF2; --muted:#A3AAB6; --nav-bg:#0A0B0E; --nav-fg:#B9BEC7; --nav-active:#22262E;
  --accent:#E5484D; --accent-fg:#FFFFFF;
  --ok:#5CC98A; --ok-soft:#173326; --warn:#F2B35B; --warn-soft:#3A2A12; --bad:#F2777A; --bad-soft:#3A1A1C; --info-soft:#262A31;
  color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{height:100%}

.brand-name{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1}

.main{flex:1 1 auto;min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

}

@media (max-width:899px){.mtab .hd{display:none}.mtab .rw{grid-template-columns:1fr 1fr;gap:12px 16px}.mtab .rw>.nm{grid-column:1/-1}.mtab .lbl{display:block;font-size:12px;color:var(--muted)}}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}

.vsl .ph{display:grid;place-items:center;color:#7b808a;font-size:10px}
.vsl .no{font-size:10px;color:#aab0bb;font-weight:600}

.slot:hover{border-color:var(--muted)}
.slot .no{font-size:12px;font-weight:700;color:var(--muted)}
.slot img,.slot .ph{width:100%;height:64px;object-fit:contain}
.slot .nm{font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}

.bar.w > i{background:var(--warn)} .bar.b > i{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}

<script>
(function(){
"use strict";

// ---------- utilidades ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money0 = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const fm = (n) => (n == null || !isFinite(n)) ? "—" : money0.format(Math.round(n));
const fint = (n) => (n == null || !isFinite(n)) ? "—" : Math.round(n).toLocaleString("es-AR");
const f1 = (n) => (n == null || !isFinite(n)) ? "—" : (Math.round(n*10)/10).toString().replace(".",",");
const pct = (n) => (n == null || !isFinite(n)) ? "—" : f1(n) + "%";
function num(v){ if (v == null) return null; const s = String(v).trim(); if (!s) return null;
  const t = s.replace(/\s|\$/g,"").replace(/\./g,"").replace(",","."); const n = Number(t); return isFinite(n) ? n : null; }
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const today = () => iso(new Date());
const hora = () => { const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const mesDe = (offset) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset); return iso(d).slice(0,7); };
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const diasDelMes = (ym) => { const [y,m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const nombreMes = (ym) => { const [y,m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("es-AR",{month:"long"}); };
function days(a){ if (!a) return null; return Math.round((new Date(a+"T00:00:00") - new Date(today()+"T00:00:00"))/86400000); }
function ago(d){ if (!d) return "sin fecha"; const n = -days(d); return n <= 0 ? "hoy" : n === 1 ? "hace 1 día" : "hace " + n + " días"; }
function fdate(d){ if (!d) return "—"; const [y,m,dd] = d.split("-"); return dd + "/" + m + "/" + y.slice(2); }
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const coincide = (p, q) => { const words = norm(q).split(/\s+/).filter(Boolean); if (!words.length) return true;
  const hay = norm([p.nombre, p.marca, p.categoria, p.ean].join(" ")); return words.every(w => hay.includes(w)); };
const img = (p, cls="thumb") => p && p.imagen ? `<img class="${cls}" src="/_blob/${esc(p.imagen)}" alt="" loading="lazy">` : `<div class="${cls} ph" aria-hidden="true">sin foto</div>`;
const delta = (a, b) => { if (!b) return a ? '<span class="delta d-eq">nuevo</span>' : ""; const d = (a/b - 1)*100; const c = d > 0.5 ? "d-up" : d < -0.5 ? "d-dn" : "d-eq"; return `<span class="delta ${c}">${d>0?"+":""}${Math.round(d)}%</span>`; };
const dur = (d) => d == null ? "sin datos" : d < 1 ? "se agota hoy" : d < 2 ? "se agota mañana" : "≈ " + Math.floor(d) + " días";

const S = { productos:{}, stock:{}, relev:{}, competidores:{}, proveedores:{}, maquinas:{}, config:{}, vdias:{}, ready:false, ro:false };
let db = null, assets = null, downloads = null;
const DEF_CONFIG = { comisionQR: 0, diasPrecioViejo: 45, diasVence: 7, diasCobertura: 7, diasReposicion: 3 };
const cfg = () => Object.assign({}, DEF_CONFIG, S.config);

// ---------- costos y márgenes ----------
const provNombre = (id) => id === SIN ? "Sin proveedor" : ((S.proveedores[id]||{}).nombre || "Proveedor borrado");
function preciosProv(p){ return Object.entries(p.proveedores||{}).filter(([,x]) => x && x.costoUnit != null).map(([id,x]) => Object.assign({id}, x)).sort((a,b)=>a.costoUnit-b.costoUnit); }
function costoActual(p){ if (!p) return null; const l = preciosProv(p); if (l.length){ const el = l.find(x => x.id === p.proveedorElegido); return (el || l[0]).costoUnit; }
  const h = p.costos||[]; return h.length ? h[h.length-1].costoUnit ?? null : null; }
function proveedorDelCosto(p){ const l = preciosProv(p); if (!l.length) return null; const el = l.find(x => x.id === p.proveedorElegido); return (el || l[0]).id; }
function margen(precio, costo){ if (precio == null || costo == null || !precio) return {neto:null,gan:null,m:null};
  const neto = precio*(1 - (cfg().comisionQR||0)/100); const gan = neto - costo; return {neto, gan, m: gan/precio*100}; }
function compStats(pid){
  const r = S.relev[pid]; const out = {kiosco:[],chino:[],pya:[],otro:[],viejo:0,total:0,ultima:null};
  if (!r || !r.precios) return out;
  for (const [cid, e] of Object.entries(r.precios)){
    const c = S.competidores[cid]; if (!c || e.lista == null) continue;
    out.total++; if (-days(e.fecha) > cfg().diasPrecioViejo) out.viejo++;
    if (!out.ultima || (e.fecha||"") > out.ultima) out.ultima = e.fecha||null;
    const item = {c, e, unit: e.lista};
    if (c.tipo === "kiosco") out.kiosco.push(item); else if (c.tipo === "chino") out.chino.push(item);
    else if (c.tipo === "pya_market" || c.tipo === "pya_comercio") out.pya.push(item); else out.otro.push(item);
  }
  return out;
}
const avg = (a) => a.length ? a.reduce((s,x)=>s+x.unit,0)/a.length : null;

// ---------- stock y máquinas ----------
const prodList = () => Object.entries(S.productos).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"","es"));
const maqList = () => Object.entries(S.maquinas).map(([id,m])=>Object.assign({id},m)).sort((a,b)=>(a.orden||0)-(b.orden||0) || (a.nombre||"").localeCompare(b.nombre||""));
const slotsDe = (m) => Object.entries(m.slots||{}).filter(([n]) => +n <= (m.cantidadSlots||60));
function stockDep(pid){ const s = S.stock[pid]; return s && s.lotes ? s.lotes.reduce((t,l)=>t+(l.cantidad||0),0) : 0; }
function stockMaq(pid, mid){ let t=0; for (const m of maqList()) if (!mid || m.id === mid) for (const [, sl] of slotsDe(m)) if (sl.productoId===pid) t += sl.cantidad||0; return t; }
function slotState(sl){ if (!sl || !sl.productoId || !sl.capacidad) return null; const r = (sl.cantidad||0)/sl.capacidad; return r <= .25 ? "b" : r <= .5 ? "w" : ""; }
function reposicion(m){
  const out = [];
  for (const [n, sl] of slotsDe(m)) if (sl.productoId && sl.capacidad){ const falta = sl.capacidad - (sl.cantidad||0); if (falta > 0) out.push({n:+n, pid:sl.productoId, falta, cant:sl.cantidad||0, cap:sl.capacidad, st:slotState(sl)}); }
  return out.sort((a,b)=>a.n-b.n);
}
function vencimientos(){
  const out = [], lim = cfg().diasVence;
  for (const [pid, s] of Object.entries(S.stock)) for (const l of (s.lotes||[])) if (l.vence && l.cantidad>0){ const d = days(l.vence); if (d <= lim) out.push({pid, d, cant:l.cantidad, lugar:"Depósito", vence:l.vence}); }
  for (const m of maqList()) for (const [n, sl] of slotsDe(m)) if (sl.productoId && sl.vence && sl.cantidad>0){ const d = days(sl.vence); if (d <= lim) out.push({pid:sl.productoId, mid:m.id, d, cant:sl.cantidad, lugar:m.nombre + " · slot " + n, vence:sl.vence}); }
  return out.sort((a,b)=>a.d-b.d);
}

// ---------- ventas (cada venta con fecha y hora) ----------
function eventos(){ const out = []; for (const [fecha, doc] of Object.entries(S.vdias)) for (const e of (doc.eventos||[])) out.push(Object.assign({fecha}, e)); return out.sort((a,b)=> (b.fecha+b.h).localeCompare(a.fecha+a.h)); }
function delMes(evs, ym, hastaDia){ return evs.filter(e => e.fecha.startsWith(ym) && (!hastaDia || +e.fecha.slice(8) <= hastaDia)); }
function resumen(evs){ let u=0, f=0, cm=0; for (const e of evs){ u += e.u; f += e.f; cm += (e.c != null ? e.c : (costoActual(S.productos[e.pid]) || 0)) * e.u; } const com = f*(cfg().comisionQR||0)/100; return {u, f, cm, com, gan: f - com - cm, n: evs.length}; }
const gastosFijos = (m) => (m.alquiler||0) + (m.otrosGastos||[]).reduce((t,g)=>t+(g.monto||0),0);
// Consumo promedio diario de un producto (en una máquina o en todas), con las ventas de los últimos 30 días
function ventanaDias(){ const evs = eventos(); if (!evs.length) return null; const primero = evs[evs.length-1].fecha; return Math.max(1, Math.min(30, -days(primero) + 1)); }
function consumo(pid, mid){ const v = ventanaDias(); if (!v) return null; const desde = addDays(today(), -(v-1)); let u = 0;
  for (const e of eventos()) if (e.fecha >= desde && e.pid === pid && (!mid || e.mid === mid)) u += e.u; return u / v; }
function diasStock(cant, cons){ return cons > 0 ? cant / cons : null; }
// Compra recomendada: lo que falta para llenar las máquinas + lo que se vende en N días − depósito
function recomendacion(pid){ let falta = 0; for (const m of maqList()) for (const r of reposicion(m)) if (r.pid === pid) falta += r.falta;
  const cons = consumo(pid) || 0; const rec = Math.max(0, Math.ceil(falta + cons * cfg().diasCobertura - stockDep(pid))); return {falta, cons, rec}; }
function compras(){ return prodList().map(p => Object.assign({p, dep: stockDep(p.id)}, recomendacion(p.id))).filter(x => x.rec > 0); }

// Alertas inteligentes
function alertas(){
  const out = [], c = cfg(), hayVentas = !!ventanaDias(), v = ventanaDias() || 0;
  for (const m of maqList()){
    const porProd = {}; for (const [n, sl] of slotsDe(m)) if (sl.productoId){ const x = porProd[sl.productoId] || {slots:[], cant:0, cap:0}; x.slots.push(n); x.cant += sl.cantidad||0; x.cap += sl.capacidad||0; porProd[sl.productoId] = x; }
    for (const [pid, x] of Object.entries(porProd)){
      const p = S.productos[pid] || {}; const cons = consumo(pid, m.id); const ds = diasStock(x.cant, cons);
      if (cons > 0 && ds != null && ds < 2) out.push({nivel:"bad", p, t:`${p.nombre}: ${ds < 1 ? "se agota hoy" : "se agota mañana"} en ${m.nombre}`, d:`Vende ${f1(cons)} u./día y quedan ${x.cant} (slot ${x.slots.join(", ")}).`});
      if (cons > 0 && x.cap && x.cap < cons * c.diasReposicion) out.push({nivel:"info", p, t:`${p.nombre} se vende mucho en ${m.nombre}`, d:`Un slot lleno dura ${f1(x.cap/cons)} días y reponés cada ${c.diasReposicion}: aumentá la capacidad del slot ${x.slots.join(", ")} o sumale otro slot.`});
      if (hayVentas && v >= 14 && consumo(pid, m.id) === 0) out.push({nivel:"warn", p, t:`${p.nombre} no se vendió en ${v} días en ${m.nombre}`, d:`Probá cambiarlo por otro producto o moverlo a un slot más visible.`});
    }
  }
  for (const x of vencimientos()) if (x.mid){ const cons = consumo(x.pid, x.mid); if (cons != null && x.d >= 0 && x.cant > cons * (x.d + 1)) { const p = S.productos[x.pid]||{}; out.push({nivel:"warn", p, t:`${p.nombre}: no se va a vender todo antes de vencer`, d:`Quedan ${x.cant} en ${x.lugar}, vence ${x.d===0?"hoy":"en "+x.d+" días"} y se venden ${f1(cons)} u./día.`}); } }
  for (const p of prodList()){
    const pv = proveedorDelCosto(p); if (pv){ const h = (p.costos||[]).filter(k => k.proveedorId === pv); if (h.length >= 2){ const a = h[h.length-2].costoUnit, b = h[h.length-1].costoUnit; if (a && b > a*1.08) out.push({nivel:"warn", p, t:`Subió el costo de ${p.nombre} un ${Math.round((b/a-1)*100)}%`, d:`Ahora ${fm(b)} c/u con ${provNombre(pv)}. Revisá el precio de venta (${fm(p.precioVenta)}).`}); } }
    const mm = margen(p.precioVenta, costoActual(p)).m; if (mm != null && mm < 15) out.push({nivel:"warn", p, t:`${p.nombre} deja poco margen (${pct(mm)})`, d:`Costo ${fm(costoActual(p))}, venta ${fm(p.precioVenta)}.`});
  }
  const orden = {bad:0, warn:1, info:2}; return out.sort((a,b)=>orden[a.nivel]-orden[b.nivel]);
}

// ---------- persistencia ----------
let toastT = null;
function toast(msg){ let t = $("#toast"); if (!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 2600); }
async function save(path, data, msg){
  if (!db){ toast("No hay conexión con la base de datos"); return false; }
  const body = JSON.parse(JSON.stringify(data));
  try { await db.doc(path).set(body); if (msg) toast(msg); return true; }
  catch(e){ if (e && e.code === "unavailable"){ try { await new Promise(r=>setTimeout(r, 600+Math.random()*600)); await db.doc(path).set(body); if (msg) toast(msg); return true; } catch(_){} }
    toast(e && e.code === "quota_exceeded" ? "Se llenó la base de datos: borrá registros viejos" : "No se pudo guardar. Probá de nuevo."); return false; }
}
async function del(path, msg){ if (!db) return; try { await db.doc(path).delete(); if (msg) toast(msg); } catch(e){ toast("No se pudo borrar"); } }
const strip = (o) => { const c = Object.assign({}, o); delete c.id; return c; };
function conPrecioHist(p, nuevo){ const d = strip(p); if (nuevo !== p.precioVenta && nuevo != null) d.precioHist = (p.precioHist||[]).concat([{fecha: today(), precio: nuevo}]).slice(-40); d.precioVenta = nuevo; return d; }
// Registra ventas (lista de {mid, pid, u}) en el documento del día, con hora, precio y costo del momento
async function registrarVentas(items){
  items = items.filter(x => x.pid && x.u > 0); if (!items.length) return;
  const f = today(), h = hora(); const doc = JSON.parse(JSON.stringify(S.vdias[f] || {fecha: f, eventos: []}));
  for (const x of items){ const p = S.productos[x.pid] || {}; doc.eventos.push({h, mid: x.mid, pid: x.pid, u: x.u, pv: p.precioVenta || 0, f: (p.precioVenta || 0) * x.u, c: costoActual(p)}); }
  S.vdias[f] = doc; await save("ventasdia/" + f, doc);
}

// ---------- gráficos ----------
function barrasDia(ym, evs, evsAnt){
  const n = diasDelMes(ym), W = 760, H = 210, L = 46, B = 24, T = 10, cw = (W - L - 8) / n;
  const act = Array(n).fill(0), ant = Array(31).fill(0); for (const e of evs) act[+e.fecha.slice(8)-1] += e.f; for (const e of evsAnt) ant[+e.fecha.slice(8)-1] += e.f;
  const max = Math.max(1, ...act, ...ant.slice(0,n)); const y = (v) => T + (H - T - B) * (1 - v/max);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Facturación por día de ${nombreMes(ym)}">`;
  for (let k=0;k<=3;k++){ const v = max*k/3, yy = y(v); s += `<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`; }
  for (let i=0;i<n;i++){ const x = L + i*cw; if (act[i]) s += `<rect x="${x+cw*0.15}" y="${y(act[i])}" width="${cw*0.7}" height="${H-B-y(act[i])}" rx="2" fill="var(--accent)"/>`;
    if (ant[i]) s += `<rect x="${x+cw*0.25}" y="${y(ant[i])-1.5}" width="${cw*0.5}" height="3" rx="1.5" fill="var(--fg)" opacity=".55"/>`;
    if ((i+1) % 5 === 0 || i === 0) s += `<text x="${x+cw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`; }
  return s + `</svg><div class="legend"><span><i style="background:var(--accent)"></i>${nombreMes(ym)}</span>${evsAnt.length ? '<span><i style="background:var(--fg);opacity:.55;height:3px"></i>mismo día del mes anterior</span>' : ""}</div>`;
}
function barrasHora(evs){
  const W = 760, H = 150, L = 8, B = 22, T = 10, cw = (W - L*2) / 24; const v = Array(24).fill(0); for (const e of evs) v[+(e.h||"00").slice(0,2)] += e.u; const max = Math.max(1, ...v);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Unidades vendidas por hora del día">`;
  for (let i=0;i<24;i++){ const x = L + i*cw, hh = (H-B-T)*v[i]/max; if (v[i]) s += `<rect x="${x+cw*0.15}" y="${H-B-hh}" width="${cw*0.7}" height="${hh}" rx="2" fill="#3C7BD9"/>`; if (i % 3 === 0) s += `<text x="${x+cw/2}" y="${H-6}" text-anchor="middle">${i}h</text>`; }
  return s + `<line x1="${L}" x2="${W-L}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/></svg>`;
}
const hbar = (rows) => { const max = Math.max(1, ...rows.map(r=>r.v)); return `<div class="hb">${rows.map(r=>`<div class="r"><span class="n" title="${esc(r.n)}">${esc(r.n)}</span><span class="b"><i style="width:${Math.max(2, r.v/max*100)}%"></i></span><span class="num small">${r.t}</span></div>`).join("")}</div>`; };

const alertasHTML = (al) => al.length ? `<div>${al.map(a=>`<div class="alert"><span class="dot ${a.nivel}" aria-hidden="true"></span>${img(a.p)}<div class="grow" style="flex:1;min-width:0"><div class="t" style="font-weight:600;font-size:14px">${esc(a.t)}</div><div class="small muted">${esc(a.d)}</div></div></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">Sin alertas por ahora. Las de consumo aparecen cuando haya ventas registradas.</p>`;

// ---------- vistas ----------
function vInicio(){
  const c = cfg(), evs = eventos(), ym = mesDe(0), dia = new Date().getDate();
  const r = resumen(delMes(evs, ym)), ra = resumen(delMes(evs, mesDe(-1), dia));
  const maqs = maqList(); const gf = maqs.reduce((t,m)=>t+gastosFijos(m),0);
  const ps = prodList(); const ms = ps.map(p => margen(p.precioVenta, costoActual(p)).m).filter(x=>x!=null); const mprom = ms.length ? ms.reduce((a,b)=>a+b,0)/ms.length : null;
  const porProd = {}; for (const e of delMes(evs, ym)){ const x = porProd[e.pid] || {u:0,f:0}; x.u += e.u; x.f += e.f; porProd[e.pid] = x; }
  const enMaq = new Set(); for (const m of maqs) for (const [,sl] of slotsDe(m)) if (sl.productoId) enMaq.add(sl.productoId);
  const top = Object.entries(porProd).map(([pid,x])=>({p:S.productos[pid]||{}, u:x.u, f:x.f})).sort((a,b)=>b.u-a.u).slice(0,5);
  const menos = [...enMaq].map(pid => ({p:S.productos[pid]||{}, u:(porProd[pid]||{}).u||0})).sort((a,b)=>a.u-b.u).slice(0,5);
  const agot = []; for (const m of maqs){ const vistos = new Set(); for (const [n, sl] of slotsDe(m)) if (sl.productoId && !vistos.has(sl.productoId)){ vistos.add(sl.productoId); const cant = stockMaq(sl.productoId, m.id), cons = consumo(sl.productoId, m.id), ds = diasStock(cant, cons); if (ds != null && ds < 3) agot.push({m, p:S.productos[sl.productoId]||{}, ds, cons, cant}); } }
  agot.sort((a,b)=>a.ds-b.ds);
  const venc = vencimientos(), compra = compras(), al = alertas();
  const sinCostos = !ps.some(p => costoActual(p) != null);
  return `
  <div class="head"><div><h1>Inicio</h1><p class="muted">${new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}</p></div>
   <div class="row"><a class="btn pri" href="#maquinas">Reponer</a><a class="btn" href="#stock" data-go-stock="compras">Lista de compras</a></div></div>
  ${sinCostos ? `<div class="notice">Para empezar: cargá en <a href="#productos">Productos</a> el costo de cada proveedor y tu precio de venta, y en <a href="#precios">Precios</a> lo que cobra la competencia.</div>` : ""}
  <section class="grid-k" aria-label="Resumen del mes">
    <div class="card kpi"><div class="l">Facturación de ${nombreMes(ym)}</div><div class="v num">${fm(r.f)}</div></div>
    <div class="card kpi"><div class="l">Ventas</div><div class="v num">${fint(r.u)} u.</div></div>

const hayDatos = () => !!ventanaDias();

function vHistorial(seg){
  const evs = eventos(), maqs = maqList(), gfTot = maqs.reduce((t,m)=>t+gastosFijos(m),0), hoy = mesDe(0);
  const meses = []; const primero = evs.length ? evs[evs.length-1].fecha.slice(0,7) : hoy;
  for (let k = 0; ; k--){ const ym = mesDe(k); if (ym < primero) break; meses.push({k, ym}); if (k < -120) break; }
  const rows = meses.map(({k, ym}) => { const x = resumen(delMes(evs, ym)); return {k, ym, x, real: x.gan - gfTot, tk: x.u ? x.f/x.u : null}; });
  rows.forEach((r, i) => { r.ant = rows[i+1] || null; });
  const anio = (ym) => ym.slice(0,4); const nm = (ym) => { const t = nombreMes(ym); return t.charAt(0).toUpperCase() + t.slice(1) + " " + anio(ym); };
  const tot = rows.reduce((a,r)=>({f:a.f+r.x.f, u:a.u+r.x.u, real:a.real+r.real}), {f:0,u:0,real:0});
  const mejor = rows.filter(r=>r.x.f>0).sort((a,b)=>b.x.f-a.x.f)[0];
  const graf = rows.slice(0,12).reverse();
  return `<div class="head"><div><h1>Ventas</h1><p class="muted">Historial de todos los meses trabajados</p></div><div class="row">${seg}</div></div>
  <section class="grid-k">
    <div class="card kpi"><div class="l">Facturación total</div><div class="v num">${fm(tot.f)}</div><div class="s">${rows.length} ${rows.length===1?"mes":"meses"}</div></div>
    <div class="card kpi"><div class="l">Unidades vendidas</div><div class="v num">${fint(tot.u)}</div></div>
    <div class="card kpi"><div class="l">Ganancia real total</div><div class="v num">${fm(tot.real)}</div></div>
    <div class="card kpi"><div class="l">Mejor mes</div><div class="v num">${mejor ? fm(mejor.x.f) : "—"}</div><div class="s">${mejor ? nm(mejor.ym) : "Sin ventas todavía"}</div></div>
  </section>
  <div class="card"><h2>Facturación por mes</h2>${hbar(graf.map(r=>({n:nm(r.ym), v:r.x.f, t:fm(r.x.f)})))}</div>
  <div class="card"><h2>Mes a mes</h2><div class="tablebox"><table style="min-width:760px"><thead><tr><th>Mes</th><th>Facturación</th><th>vs. mes anterior</th><th>Unidades</th><th>Ticket promedio</th><th>Ganancia real</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="click" data-vmes="${r.k}" tabindex="0"><td><strong>${nm(r.ym)}</strong>${r.k===0?' <span class="muted small">(en curso)</span>':""}</td><td class="num">${fm(r.x.f)}</td><td>${r.ant ? delta(r.x.f, r.ant.x.f) : '<span class="muted small">—</span>'}</td><td class="num">${fint(r.x.u)}</td><td class="num">${r.tk!=null ? fm(r.tk) : "—"}</td><td class="num"><span class="pill ${r.real>=0?"p-ok":"p-bad"}">${fm(r.real)}</span></td></tr>`).join("")}
  </tbody></table></div><p class="muted small" style="margin:8px 0 0">Tocá un mes para ver el detalle. El mes en curso se compara contra el mes anterior completo, así que va a parecer más bajo hasta que termine.</p></div>`;
}

  <section class="grid-k">
    <div class="card kpi"><div class="l">Facturación</div><div class="v num">${fm(r.f)}</div><div class="s">${esActual ? "Mes en curso" : "Total del mes"}</div></div>
    <div class="card kpi"><div class="l">Unidades vendidas</div><div class="v num">${fint(r.u)}</div><div class="s">${fint(r.n)} registros</div></div>
    <div class="card kpi"><div class="l">Ticket promedio</div><div class="v num">${r.u ? fm(r.f/r.u) : "—"}</div><div class="s">Por unidad vendida</div></div>
    <div class="card kpi"><div class="l">Ganancia real</div><div class="v num">${fm(rentRows.reduce((t,x)=>t+x.real,0))}</div><div class="s">Todas las máquinas, con gastos fijos</div></div>
  </section>
  ${em.length ? `
  <div class="card"><h2>Facturación por día</h2>${barrasDia(ym, em, ea)}</div>
  <div class="card"><h2>Rentabilidad real por máquina</h2><div class="tablebox"><table style="min-width:720px"><thead><tr><th>Máquina</th><th>Unidades</th><th>Facturación</th><th>Costo mercadería</th><th>Comisión QR</th><th>Gastos fijos</th><th>Ganancia real</th></tr></thead><tbody>
    ${rentRows.map(x=>`<tr class="click" data-ir-maq="${esc(x.m.id)}"><td><strong>${esc(x.m.nombre)}</strong></td><td class="num">${fint(x.x.u)}</td><td class="num">${fm(x.x.f)}</td><td class="num">${fm(x.x.cm)}</td><td class="num">${fm(x.x.com)}</td><td class="num">${fm(x.gf)}</td><td class="num"><span class="pill ${x.real>=0?"p-ok":"p-bad"}">${fm(x.real)}</span></td></tr>`).join("")}

  if (UI.orden === "ganancia") rows.sort((a,b)=> nul(b.mm.gan,-1) - nul(a.mm.gan,-1));

function vStock(){

      : `<div class="empty">Nada vence en los próximos ${c.diasVence} días. Cargá la fecha de vencimiento al registrar cada compra.</div>`;

    const cs = compras();
    body = cs.length ? `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2>${cs.length} productos para comprar</h2><div class="row"><button class="btn" type="button" data-act="copiar-compras">Copiar lista</button><button class="btn" type="button" data-act="csv-compras">Descargar CSV</button></div></div>
      <p class="muted small" style="margin:0 0 6px">Para llenar los slots y cubrir ${c.diasCobertura} días de ventas, menos lo que ya tenés en el depósito.</p>
      <div class="list">${cs.map(x=>`<div class="li">${img(x.p)}<div class="grow"><div class="t">${esc(x.p.nombre)}</div><div class="d">Depósito ${x.dep} · faltan ${x.falta} para llenar${x.cons ? " · vende " + f1(x.cons) + "/día" : ""}${proveedorDelCosto(x.p)?" · mejor precio: "+esc(provNombre(proveedorDelCosto(x.p))):""}</div></div><span class="pill p-warn">comprar ${x.rec}</span></div>`).join("")}</div></div>`
      : `<div class="empty">No hace falta comprar nada (o falta cargar la capacidad de los slots).</div>`;
  }
  return `<div class="head"><div><h1>Stock</h1><p class="muted">Depósito, vencimientos y compras</p></div>${S.ro?"":`<button class="btn pri" type="button" data-act="compra">Registrar compra</button>`}</div>
  <div class="seg" role="group" aria-label="Vista">${tab("deposito","Depósito")}${tab("vence","Vencimientos")}${tab("compras","Lista de compras")}</div>${body}`;

function vMaquinas(){
  const ms = maqList(), evs = eventos(), ym = mesDe(0);
  if (!UI.maq || !S.maquinas[UI.maq]){
    UI.maq = null;
    const hoyD = new Date(); const dias14 = []; for (let i=13;i>=0;i--){ const d = new Date(hoyD); d.setDate(d.getDate()-i); dias14.push(iso(d)); }
    const filas = ms.map(m => { const rep = reposicion(m); const n = m.cantidadSlots||60; const x = resumen(delMes(evs, ym).filter(e=>e.mid===m.id)); const real = x.gan - gastosFijos(m);
      let cant = 0, cap = 0, vacios = 0; for (const [, sl] of slotsDe(m)) if (sl.productoId && sl.capacidad){ cant += Math.min(sl.cantidad||0, sl.capacidad); cap += sl.capacidad; if (!(sl.cantidad > 0)) vacios++; }
      const pctS = cap ? Math.round(cant/cap*100) : null; const bajos = rep.filter(r => r.st === "b" || r.st === "w");
      const porDia = dias14.map(d => evs.filter(e => e.mid===m.id && e.fecha===d).reduce((t,e)=>t+e.f,0)); const mx = Math.max(...porDia);
      const spark = mx > 0 ? `<svg class="spark" viewBox="0 0 130 34" role="img" aria-label="Facturación de los últimos 14 días"><polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${porDia.map((v,i)=>`${(i*130/13).toFixed(1)},${(31 - v/mx*28).toFixed(1)}`).join(" ")}"/></svg>` : '<span class="sub">Sin ventas</span>';
      return {m, n, x, real, pctS, vacios, rep, bajos, spark}; });
    const T = filas.reduce((a,r)=>({f:a.f+r.x.f, u:a.u+r.x.u, real:a.real+r.real}), {f:0,u:0,real:0});
    return `<div class="head"><div><h1>Máquinas</h1><p class="muted">${ms.length} ${ms.length===1?"máquina":"máquinas"}</p></div>${S.ro?"":`<button class="btn pri" type="button" data-act="nueva-maq">Agregar máquina</button>`}</div>
    ${ms.length ? `<div class="mtab"><div class="hd"><span>Máquina</span><span>Ventas del mes</span><span>Ganancia real</span><span>Ticket</span><span>Stock en máquina</span><span>Últimos 14 días</span></div>
    ${filas.map(r => `<div class="rw" role="button" tabindex="0" data-maq="${esc(r.m.id)}">
      <div class="nm"><div class="ic" aria-hidden="true"></div><div style="min-width:0"><div class="row" style="gap:8px;flex-wrap:nowrap"><span class="n">${esc(r.m.nombre)}</span>${S.ro?"":`<button class="btn ghost sm" type="button" data-edit-maq="${esc(r.m.id)}" aria-label="Editar ${esc(r.m.nombre)}">Editar</button>`}</div><div class="sub">${esc(r.m.ubicacion||"")}${r.m.ubicacion?" · ":""}${r.n} slots</div>
        ${r.bajos.length ? `<span class="pill p-warn" style="margin-top:6px">Reponer ${r.rep.reduce((t,x)=>t+x.falta,0)} u. en ${r.rep.length} slots</span>` : r.pctS == null ? `<span class="pill p-info" style="margin-top:6px">Cargá las capacidades de los slots</span>` : `<span class="pill p-ok" style="margin-top:6px">Todo en orden</span>`}</div></div>
      <div><span class="lbl">Ventas del mes</span><div class="v num">${fm(r.x.f)}</div><div class="sub">${fint(r.x.u)} u.</div></div>
      <div><span class="lbl">Ganancia real</span><div class="v num">${fm(r.real)}</div><div class="sub">${r.x.f ? "margen " + pct(r.real/r.x.f*100) : "con gastos fijos"}</div></div>
      <div><span class="lbl">Ticket</span><div class="v num">${r.x.u ? fm(r.x.f/r.x.u) : "—"}</div></div>
      <div><span class="lbl">Stock en máquina</span>${r.pctS == null ? '<div class="sub">Sin capacidades cargadas</div>' : `<div class="sub">${r.pctS}% lleno · ${r.vacios} ${r.vacios===1?"vacío":"vacíos"}</div><div class="meter ${r.pctS<40?"b":r.pctS<70?"w":""}"><i style="width:${r.pctS}%"></i></div>`}</div>
      <div><span class="lbl">Últimos 14 días</span>${r.spark}</div></div>`).join("")}
    ${ms.length > 1 ? `<div class="tot"><span class="muted">Total del mes</span><span><b class="num">${fm(T.f)}</b> <span class="muted">facturado</span></span><span><b class="num">${fm(T.real)}</b> <span class="muted">ganancia real</span></span><span><b class="num">${fint(T.u)}</b> <span class="muted">unidades</span></span></div>` : ""}</div>`
      : `<div class="empty">Todavía no hay máquinas.</div>`}`;
  }
  const m = Object.assign({id:UI.maq}, S.maquinas[UI.maq]);
  const n = m.cantidadSlots || 60, rep = reposicion(m), gf = gastosFijos(m);
  const x = resumen(delMes(evs, ym).filter(e=>e.mid===m.id)), xa = resumen(delMes(evs, mesDe(-1), new Date().getDate()).filter(e=>e.mid===m.id));
  const pron = []; const vistos = new Set(); for (const [, sl] of slotsDe(m)) if (sl.productoId && !vistos.has(sl.productoId)){ vistos.add(sl.productoId); const cant = stockMaq(sl.productoId, m.id), cons = consumo(sl.productoId, m.id); if (cons > 0) pron.push({p:S.productos[sl.productoId]||{}, cant, cons, ds: diasStock(cant, cons), slots: slotsDe(m).filter(([,s])=>s.productoId===sl.productoId).map(([k])=>k)}); }
  pron.sort((a,b)=>a.ds-b.ds);
  let cantT = 0, capT = 0; for (const [, sl] of slotsDe(m)) if (sl.productoId && sl.capacidad){ cantT += Math.min(sl.cantidad||0, sl.capacidad); capT += sl.capacidad; }
  const pctS = capT ? Math.round(cantT/capT*100) : null;
  const cel = (i) => { const sl = (m.slots||{})[i] || {}; const p = sl.productoId ? S.productos[sl.productoId] : null; const st = slotState(sl); const vacio = p && sl.capacidad && !(sl.cantidad > 0);
    return `<button type="button" class="vsl ${vacio?"e":""} ${p?"":"v"}" data-slot="${i}" aria-label="Slot ${i}${p?": "+esc(p.nombre)+(sl.capacidad?", "+(sl.cantidad||0)+" de "+sl.capacidad:""):" sin asignar"}" title="${p?esc(p.nombre):"Sin asignar"}"><span class="no">${i}</span>${p?img(p,""):`<span class="ph">vacío</span>`}
    ${p && sl.capacidad ? `<span class="q num">${sl.cantidad||0}/${sl.capacidad}</span><span class="bar ${st||""}"><i style="width:${Math.min(100,Math.round((sl.cantidad||0)/sl.capacidad*100))}%"></i></span>` : p ? `<span class="q">—</span>` : ""}</button>`; };
  let bandejas = ""; for (let i=1;i<=n;i+=11){ let f = ""; for (let j=i;j<Math.min(i+11,n+1);j++) f += cel(j); bandejas += `<div class="tray">${f}</div>`; }
  const agotan = pron.length ? pron.slice(0,8).map(x=>`<div class="li">${img(x.p)}<div class="grow"><div class="t">${esc(x.p.nombre)}</div><div class="d">Slot ${x.slots.join(", ")} · quedan ${x.cant} · vende ${f1(x.cons)}/día</div></div><span class="pill ${x.ds<1?"p-bad":x.ds<3?"p-warn":"p-ok"}">${x.ds<1?"hoy":x.ds<2?"mañana":Math.floor(x.ds)+" días"}</span></div>`).join("")
    : rep.length ? [...rep].sort((a,b)=>a.cant/a.cap-b.cant/b.cap).slice(0,8).map(r=>{ const pp = S.productos[r.pid]||{}; return `<div class="li">${img(pp)}<div class="grow"><div class="t">${esc(pp.nombre||"")}</div><div class="d">Slot ${r.n} · quedan ${r.cant} de ${r.cap}</div></div><span class="pill ${r.cant===0?"p-bad":r.st?"p-warn":"p-info"}">${r.cant===0?"vacío":"faltan "+r.falta}</span></div>`; }).join("")
    : "";
  return `<button type="button" class="back" data-act="volver-maq">← Todas las máquinas</button>
  <div class="head"><div><h1>${esc(m.nombre)}</h1><p class="muted">${esc(m.ubicacion||"")}${m.ubicacion?" · ":""}${n} slots</p></div><div class="row">${S.ro?"":`<button class="btn" type="button" data-act="editar-maq">Editar</button><button class="btn" type="button" data-act="contar">Contar y reponer</button><button class="btn pri" type="button" data-act="preparar">Preparar reposición</button>`}</div></div>
  <section class="grid-k"><div class="card kpi"><div class="l">Ventas del mes</div><div class="v num">${fm(x.f)}</div><div class="s">${fint(x.u)} u.</div></div>
   <div class="card kpi"><div class="l">Ganancia real del mes</div><div class="v num">${fm(x.gan - gf)}</div><div class="s">${x.f ? "margen " + pct((x.gan-gf)/x.f*100) : "Costo, QR y gastos fijos descontados"}</div></div>
   <div class="card kpi"><div class="l">Ticket promedio</div><div class="v num">${x.u ? fm(x.f/x.u) : "—"}</div><div class="s">por unidad</div></div>
   <div class="card kpi"><div class="l">Stock en máquina</div><div class="v num">${pctS == null ? "—" : pctS + "%"}</div><div class="s">${rep.length ? `faltan ${rep.reduce((t,r)=>t+r.falta,0)} u. en ${rep.length} slots` : pctS == null ? "Cargá la capacidad de cada slot" : "Completa"}</div></div></section>
  <div class="vwrap"><div><div class="vscroll"><div class="vmach"><div class="vglass">${bandejas}</div><div class="vpanel" aria-hidden="true"><i class="scr"></i><i class="qr"></i><i class="pay"></i></div></div></div>
   <p class="muted small" style="margin:8px 0 0">Tocá un producto para cambiarlo o corregir la capacidad y la cantidad. Borde rojo: slot vacío.</p></div>
   <div class="card"><h2>${pron.length ? "Se agotan primero" : "Para reponer"}</h2>${agotan ? `<div class="list">${agotan}</div>` : `<p class="muted small" style="margin:0">${pctS == null ? "Cuando cargues la capacidad y la cantidad de cada slot vas a ver acá lo que hay que reponer." : "Todos los slots están completos."}</p>`}
   ${!pron.length && agotan ? `<p class="muted small" style="margin:8px 0 0">Cuando haya ventas registradas vas a ver en cuántos días se agota cada producto.</p>` : ""}</div></div>`;
}

function bindSearch(id, key){ const el = $(id); if (!el) return; el.addEventListener("input", e => { UI[key] = e.target.value; const pos = e.target.selectionStart; render(); const n = $(id); if (n){ n.focus(); try{ n.setSelectionRange(pos,pos);}catch(_){} } }); }

  v.querySelectorAll("[data-prod]").forEach(b => b.addEventListener("click", () => openProducto(b.dataset.prod)));
  v.querySelectorAll("[data-precio]").forEach(b => { b.addEventListener("click", () => openPrecio(b.dataset.precio)); b.addEventListener("keydown", e => { if (e.key==="Enter") openPrecio(b.dataset.precio); }); });
  v.querySelectorAll("[data-pf]").forEach(b => b.addEventListener("click", () => { UI.precioFiltro = b.dataset.pf; render(); }));
  v.querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", () => { UI.stockTab = b.dataset.st; render(); }));
  v.querySelectorAll("[data-vmes]").forEach(b => b.addEventListener("click", () => { UI.vmes = b.dataset.vmes === "hist" ? "hist" : +b.dataset.vmes; UI.histN = 40; render(); }));
  v.querySelectorAll("[data-go-stock]").forEach(b => b.addEventListener("click", () => { UI.stockTab = b.dataset.goStock; }));
  v.querySelectorAll("[data-lotes]").forEach(b => b.addEventListener("click", () => openLotes(b.dataset.lotes)));
  const irMaq = (id) => { UI.maq = id; if (route !== "maquinas"){ location.hash = "maquinas"; } else { render(); window.scrollTo(0,0); } };

  v.querySelectorAll("[data-ir-maq]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.irMaq; location.hash = "maquinas"; setTimeout(()=>{ UI.maq = id; render(); }, 0); }));
  v.querySelectorAll("[data-edit-maq]").forEach(b => b.addEventListener("click", (e) => { e.stopPropagation(); openMaquina(b.dataset.editMaq); }));
  v.querySelectorAll("[data-slot]").forEach(b => b.addEventListener("click", () => openSlot(UI.maq, b.dataset.slot)));
  v.querySelectorAll("[data-lista-prov]").forEach(b => b.addEventListener("click", () => openListaProveedor(b.dataset.listaProv)));
  v.querySelectorAll("[data-del-comp]").forEach(b => b.addEventListener("click", () => confirmar("¿Borrar este competidor? Sus precios cargados dejan de contar.", () => del("competidores/"+b.dataset.delComp, "Competidor borrado"))));
  v.querySelectorAll("[data-del-prov]").forEach(b => b.addEventListener("click", () => confirmar("¿Borrar este proveedor? Sus precios dejan de aparecer.", () => del("proveedores/"+b.dataset.delProv, "Proveedor borrado"))));
  v.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => acciones[b.dataset.act] && acciones[b.dataset.act]()));
  const fc = $("#f-cfg"); if (fc) fc.addEventListener("submit", e => { e.preventDefault(); save("config/general", { comisionQR: num($("#c-com").value) ?? 0, diasPrecioViejo: num($("#c-vie").value) ?? 45, diasVence: num($("#c-ven").value) ?? 7, diasCobertura: num($("#c-cob").value) ?? 7, diasReposicion: num($("#c-rep").value) ?? 3 }, "Ajustes guardados"); });
  const fcp = $("#f-comp"); if (fcp) fcp.addEventListener("submit", e => { e.preventDefault(); const n = $("#n-comp").value.trim(); if (!n) return; save("competidores/"+uid(), {nombre:n, tipo:$("#t-comp").value}, "Competidor agregado"); });
  const fpv = $("#f-prov"); if (fpv) fpv.addEventListener("submit", e => { e.preventDefault(); const n = $("#n-prov").value.trim(); if (!n) return; save("proveedores/"+uid(), {nombre:n}, "Proveedor agregado"); });

async function copiar(text){ try { await navigator.clipboard.writeText(text); toast("Copiado"); } catch(_){ openDrawer("Copiá el texto", `<textarea class="inp" style="min-height:300px" readonly>${esc(text)}</textarea>`, `<button class="btn" type="button" data-close>Cerrar</button>`); } }
async function bajar(nombre, filas){ const csv = "﻿" + filas.map(r => r.map(x => { const s = String(x ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(";")).join("\n");
  if (!downloads){ copiar(csv); return; } try { await downloads.save({filename:nombre, data:csv}); } catch(e){ if (e && e.code !== "declined") toast("No se pudo descargar"); } }
const acciones = {
  "nuevo-prod": () => openProducto(null),
  "compra": () => openCompra(null),
  "nueva-maq": () => openMaquina(null),
  "editar-maq": () => openMaquina(UI.maq),
  "volver-maq": () => { UI.maq = null; render(); window.scrollTo(0,0); },
  "contar": () => openConteo(UI.maq),
  "preparar": () => openPreparar(UI.maq),
  "mas-hist": () => { UI.histN += 60; render(); },
  "copiar-compras": () => copiar("Lista de compras\n" + compras().map(x => x.p.nombre + ": " + x.rec).join("\n")),
  "csv-compras": () => bajar("lista-de-compras.csv", [["Producto","Depósito","Faltan para llenar","Vende por día","Comprar","Mejor proveedor"], ...compras().map(x=>[x.p.nombre, x.dep, x.falta, x.cons ? f1(x.cons) : "", x.rec, proveedorDelCosto(x.p) ? provNombre(proveedorDelCosto(x.p)) : ""])]),
  "csv-ventas": () => { const ym = mesDe(typeof UI.vmes === "number" ? UI.vmes : 0); bajar("ventas-" + ym + ".csv", [["Fecha","Hora","Máquina","Producto","Categoría","Unidades","Precio","Importe","Costo unitario"], ...delMes(eventos(), ym).map(e=>[e.fecha, e.h, (S.maquinas[e.mid]||{}).nombre||"", (S.productos[e.pid]||{}).nombre||"", (S.productos[e.pid]||{}).categoria||"", e.u, Math.round(e.pv||0), Math.round(e.f), e.c==null?"":Math.round(e.c)])]); },

// ---------- panel lateral ----------
function openDrawer(title, body, foot, onMount){
  drawerOpen = true; const layer = $("#layer"); const prev = document.activeElement;
  layer.innerHTML = `<div class="scrim" data-close></div><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh"><h2>${esc(title)}</h2><button class="btn ghost" type="button" data-close aria-label="Cerrar">✕</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:""}</section>`;
  const close = () => { layer.innerHTML = ""; drawerOpen = false; document.removeEventListener("keydown", onKey); if (pending){ pending = false; render(); } try { prev && prev.focus(); } catch(_){} };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  layer.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  if (onMount) onMount(layer.querySelector(".drawer"), close);
  return close;
}
function confirmar(msg, ok){ openDrawer("Confirmar", `<p style="margin:0">${esc(msg)}</p>`, `<button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="ok-confirm">Sí, seguir</button>`, (d, close) => { $("#ok-confirm", d).addEventListener("click", async () => { close(); await ok(); }); }); }
const opts = (obj, sel, empty) => (empty?`<option value="">${empty}</option>`:"") + Object.entries(obj).sort((a,b)=>(a[1].nombre||"").localeCompare(b[1].nombre||"")).map(([id,x])=>`<option value="${esc(id)}" ${id===sel?"selected":""}>${esc(x.nombre)}</option>`).join("");
function setPrecioProveedor(p, provId, precioBulto, unidadesBulto, fecha){
  const provs = Object.assign({}, p.proveedores||{}); const costoUnit = precioBulto/(unidadesBulto||1);
  provs[provId] = {precioBulto, unidadesBulto: unidadesBulto||1, costoUnit, fecha: fecha||today()};
  const costos = (p.costos||[]).concat([{fecha: fecha||today(), proveedorId: provId, precioBulto, unidadesBulto: unidadesBulto||1, costoUnit}]).slice(-60);
  return Object.assign({}, p, {proveedores: provs, costos});
}

    const calc = () => { const b = num($("#k-bul",d).value)||0, u = num($("#k-upb",d).value)||1, pr = num($("#k-pre",d).value); $("#k-res",d).textContent = pr==null ? "Completá el precio para ver el costo por unidad." : `Entran ${b*u} unidades al depósito · costo ${fm(pr/u)} por unidad · total ${fm(pr*b)}`; };
    d.querySelectorAll("input").forEach(i => i.addEventListener("input", calc));
    $("#k-ok", d).addEventListener("click", async () => { const id = $("#k-prod",d).value, b = num($("#k-bul",d).value)||0, u = num($("#k-upb",d).value)||1, pr = num($("#k-pre",d).value), ven = $("#k-ven",d).value || null, prov = $("#k-prov",d).value || SIN;
      if (!id || b*u <= 0){ toast("Revisá producto y cantidad"); return; }
      if (pr != null){ const np = setPrecioProveedor(S.productos[id], prov, pr, u); delete np.id; await save("productos/"+id, np); }
      const s = S.stock[id] || {lotes:[]}; const lotes = (s.lotes||[]).filter(l=>l.cantidad>0).concat([{id: uid(), cantidad: b*u, vence: ven, fecha: today(), costoUnit: pr!=null?pr/u:null, proveedorId: prov}]);
      if (await save("stock/"+id, {lotes}, "Compra registrada: +" + (b*u) + " u.")) close(); });
  });
}

function openLotes(pid){
  const p = S.productos[pid]||{}; const lots = ((S.stock[pid]||{}).lotes||[]).map(l=>Object.assign({},l));
  const row = (l,i) => `<div class="fgrid" data-i="${i}" style="align-items:end;border-top:1px solid var(--line-2);padding-top:10px"><label class="field">Cantidad<input inputmode="numeric" data-k="cantidad" value="${esc(l.cantidad)}"></label><label class="field">Vence<input type="date" data-k="vence" value="${esc(l.vence||"")}"></label><div class="muted small">Ingresó ${fdate(l.fecha)}</div></div>`;
  openDrawer("Lotes · " + (p.nombre||""), `${lots.length ? lots.map(row).join("") : '<p class="muted">Sin lotes en depósito.</p>'}<p class="muted small">Corregí cantidades después de un conteo, o poné 0 para dar de baja (vencido, roto o faltante).</p><button class="btn" type="button" id="l-add">Registrar una compra</button>`,
    `<button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="l-ok">Guardar</button>`, (d, close) => {
    $("#l-add", d).addEventListener("click", () => { close(); openCompra(pid); });
    $("#l-ok", d).addEventListener("click", async () => { d.querySelectorAll("[data-i]").forEach(el => { const l = lots[+el.dataset.i]; l.cantidad = num(el.querySelector('[data-k="cantidad"]').value) || 0; l.vence = el.querySelector('[data-k="vence"]').value || null; });
      if (await save("stock/"+pid, {lotes: lots.filter(l=>l.cantidad>0)}, "Stock actualizado")) close(); });
  });
}

function sacarDeposito(stock, pid, cant){ const s = stock[pid]; const lotes = ((s && s.lotes)||[]).map(l=>Object.assign({},l)).sort((a,b)=>(a.vence||"9999").localeCompare(b.vence||"9999"));
  let falta = cant, venceMin = null; for (const l of lotes){ if (falta<=0) break; const t = Math.min(l.cantidad, falta); if (t>0){ l.cantidad -= t; falta -= t; if (l.vence && (!venceMin || l.vence < venceMin)) venceMin = l.vence; } }
  return {lotes: lotes.filter(l=>l.cantidad>0), sacado: cant - falta, venceMin}; }

// Aplica un conteo de toda la máquina: registra ventas y, si se pide, repone hasta llenar
async function aplicarConteo(mid, quedan, reponer){
  const m = JSON.parse(JSON.stringify(S.maquinas[mid])); const stock = JSON.parse(JSON.stringify(S.stock)); const ventas = []; const tocados = new Set(); let repuestas = 0, cortos = 0;
  for (const [n, sl] of slotsDe(m)){ if (!sl.productoId) continue;
    if (quedan[n] != null){ const q = quedan[n]; if ((sl.cantidad||0) > q) ventas.push({mid, pid: sl.productoId, u: (sl.cantidad||0) - q}); sl.cantidad = q; }
    if (reponer && sl.capacidad && sl.cantidad < sl.capacidad){ const need = sl.capacidad - sl.cantidad; const x = sacarDeposito(stock, sl.productoId, need); stock[sl.productoId] = {lotes: x.lotes}; tocados.add(sl.productoId);
      sl.cantidad += x.sacado; repuestas += x.sacado; if (x.sacado < need) cortos++; if (x.venceMin && (!sl.vence || x.venceMin < sl.vence)) sl.vence = x.venceMin; } }
  const agrupadas = {}; for (const v of ventas){ agrupadas[v.pid] = agrupadas[v.pid] || {mid, pid: v.pid, u: 0}; agrupadas[v.pid].u += v.u; }
  await registrarVentas(Object.values(agrupadas));
  for (const pid of tocados) await save("stock/"+pid, stock[pid]);
  const vend = ventas.reduce((t,v)=>t+v.u,0);
  await save("maquinas/"+mid, m, (vend ? vend + " vendidas registradas" : "Conteo guardado") + (reponer ? " · repuestas " + repuestas + " u." + (cortos ? " (" + cortos + " slots quedaron cortos)" : "") : ""));
}
function openConteo(mid){
  const m = S.maquinas[mid]; const filas = slotsDe(m).filter(([,s])=>s.productoId).sort((a,b)=>a[0]-b[0]);
  const body = `<p class="muted small" style="margin:0">Escribí cuántas unidades quedan en cada slot. La diferencia con la última carga se registra como venta, con la fecha y hora de ahora.</p>
   <div>${filas.map(([n,s])=>{ const p = S.productos[s.productoId]||{}; return `<div class="cnt">${img(p)}<div style="min-width:0"><div style="font-weight:600;font-size:14px">Slot ${n} · ${esc(p.nombre)}</div><div class="small muted">Había ${s.cantidad||0}${s.capacidad?" de "+s.capacidad:""}</div></div><input data-n="${n}" inputmode="numeric" value="${esc(s.cantidad||0)}" aria-label="Quedan en slot ${n}"></div>`; }).join("") || '<p class="muted">No hay slots con producto asignado.</p>'}</div>`;
  openDrawer("Contar y reponer · " + m.nombre, body, `<button class="btn" type="button" data-close>Cancelar</button><button class="btn" type="button" id="cn-ok">Guardar conteo</button><button class="btn pri" type="button" id="cn-rep">Guardar y reponer todo</button>`, (d, close) => {
    const leer = () => { const q = {}; d.querySelectorAll("[data-n]").forEach(i => { const v = num(i.value); if (v != null) q[i.dataset.n] = Math.max(0, v); }); return q; };
    d.querySelectorAll("[data-n]").forEach(i => i.addEventListener("focus", () => i.select()));
    $("#cn-ok", d).addEventListener("click", async () => { const q = leer(); close(); await aplicarConteo(mid, q, false); });
    $("#cn-rep", d).addEventListener("click", async () => { const q = leer(); close(); await aplicarConteo(mid, q, true); });
  });
}
function openPreparar(mid){
  const m = S.maquinas[mid]; const tot = {}; for (const r of reposicion(m)){ tot[r.pid] = tot[r.pid] || {u:0, slots:[]}; tot[r.pid].u += r.falta; tot[r.pid].slots.push(r.n); }
  const items = Object.entries(tot).map(([pid,x])=>({p:S.productos[pid]||{}, pid, u:x.u, slots:x.slots, dep: stockDep(pid)})).sort((a,b)=>(a.p.nombre||"").localeCompare(b.p.nombre||"","es"));
  const corto = (n) => String(n||"").replace(/\s+\d+([.,]\d+)?\s*(ml|g|grs|gr|lts?|cc)\b.*$/i, "").trim();
  const texto = items.map(x => corto(x.p.nombre) + " " + x.u).join(" | ");
  const body = items.length ? `<p class="muted small" style="margin:0">Lo que tenés que llevar para dejar ${esc(m.nombre)} llena, según lo que quedó la última vez que contaste.</p>
    <div class="reptxt" id="rp-txt">${esc(texto)}</div>
    <div class="list">${items.map(x=>`<div class="li">${img(x.p)}<div class="grow"><div class="t">${esc(x.p.nombre)}</div><div class="d">Slot ${x.slots.join(", ")} · en depósito ${x.dep}${x.dep < x.u ? ' <strong style="color:var(--warn)">(no alcanza)</strong>' : ""}</div></div><span class="pill p-warn">${x.u}</span></div>`).join("")}</div>
    <p class="muted small" style="margin:0">Total: ${items.reduce((t,x)=>t+x.u,0)} unidades de ${items.length} productos.</p>`
    : `<div class="empty">No hay nada para reponer: todos los slots están llenos, o falta cargar la capacidad de cada slot.</div>`;
  openDrawer("Preparar reposición · " + m.nombre, body, items.length ? `<button class="btn" type="button" data-close>Cerrar</button><button class="btn" type="button" id="rp-copy">Copiar lista</button><button class="btn pri" type="button" id="rp-ok">Ya repuse todo</button>` : `<button class="btn" type="button" data-close>Cerrar</button>`, (d, close) => {
    const cp = $("#rp-copy", d); if (cp) cp.addEventListener("click", () => copiar("Reposición " + m.nombre + "\n" + texto));
    const ok = $("#rp-ok", d); if (ok) ok.addEventListener("click", async () => { close(); await aplicarConteo(mid, {}, true); });
  });
}

function openSlot(mid, n){
  const m = S.maquinas[mid]; const sl = Object.assign({}, (m.slots||{})[n]); const p = sl.productoId ? S.productos[sl.productoId] : null;
  const cons = p ? consumo(sl.productoId, mid) : null;
  const body = `<div class="fgrid"><label class="field" style="grid-column:1/-1">Producto<select id="o-prod"><option value="">Vacío</option>${prodList().map(x=>`<option value="${esc(x.id)}" ${x.id===sl.productoId?"selected":""}>${esc(x.nombre)}</option>`).join("")}</select></label>
   <label class="field">Capacidad (u.)<input id="o-cap" inputmode="numeric" value="${esc(sl.capacidad)}"></label><label class="field">Quedan ahora (u.)<input id="o-can" inputmode="numeric" value="${esc(sl.cantidad ?? 0)}"></label>
   <label class="field">Vence (el más próximo)<input id="o-ven" type="date" value="${esc(sl.vence||"")}"></label></div>
   ${cons > 0 ? `<div class="notice">Este producto vende ${f1(cons)} u./día en ${esc(m.nombre)} · ${dur(diasStock(stockMaq(sl.productoId, mid), cons))}.${sl.capacidad ? " Lleno dura ≈ " + f1(sl.capacidad/cons) + " días." : ""}</div>` : ""}
   <div class="notice">Si bajás la cantidad, la diferencia se registra como venta. ${p ? "En depósito hay " + stockDep(sl.productoId) + " u." : ""}</div>`;
  openDrawer(m.nombre + " · slot " + n, body, S.ro ? `<button class="btn" type="button" data-close>Cerrar</button>` : `<button class="btn" type="button" data-close>Cancelar</button><button class="btn" type="button" id="o-fill">Reponer hasta llenar</button><button class="btn pri" type="button" id="o-ok">Guardar</button>`, (d, close) => {
    const leer = () => ({productoId: $("#o-prod",d).value || null, capacidad: num($("#o-cap",d).value), cantidad: num($("#o-can",d).value) || 0, vence: $("#o-ven",d).value || null});
    const vendidas = (x) => (x.productoId && x.productoId === sl.productoId && (sl.cantidad||0) > x.cantidad) ? (sl.cantidad||0) - x.cantidad : 0;
    const guardar = async (nsl, msg) => { const cur = S.maquinas[mid]; const slots = Object.assign({}, cur.slots||{}); if (nsl.productoId) slots[n] = nsl; else delete slots[n]; return save("maquinas/"+mid, Object.assign({}, cur, {slots}), msg); };
    const ok = $("#o-ok", d); if (ok) ok.addEventListener("click", async () => { const x = leer(); const v = vendidas(x); await registrarVentas([{mid, pid: x.productoId, u: v}]);
      if (await guardar(x, "Slot " + n + " guardado" + (v ? " · " + v + " vendidas" : ""))) close(); });
    const fill = $("#o-fill", d); if (fill) fill.addEventListener("click", async () => { const x = leer(); if (!x.productoId || !x.capacidad){ toast("Elegí producto y capacidad"); return; }
      const v = vendidas(x); const need = x.capacidad - x.cantidad; if (need <= 0){ toast("El slot ya está lleno"); return; }
      const r = sacarDeposito(S.stock, x.productoId, need); if (r.sacado <= 0){ toast("No hay stock en el depósito"); return; }
      await registrarVentas([{mid, pid: x.productoId, u: v}]);
      x.cantidad += r.sacado; if (r.venceMin && (!x.vence || r.venceMin < x.vence)) x.vence = r.venceMin;
      await save("stock/"+x.productoId, {lotes: r.lotes}); if (await guardar(x, "Repuestas " + r.sacado + " u." + (r.sacado < need ? " (no alcanzó el depósito)" : ""))) close(); });
  });
}

function openMaquina(mid){
  const m = mid ? S.maquinas[mid] : {nombre:"Máquina " + (maqList().length + 1), ubicacion:"", cantidadSlots:60, mediosPago:["qr"], alquiler:null, otrosGastos:[], slots:{}, orden: maqList().length + 1};
  const gastos = (m.otrosGastos||[]).map(g=>Object.assign({},g));
  const gRow = (g,i) => `<div class="fgrid" data-g="${i}" style="align-items:end"><label class="field">Concepto<input data-k="concepto" value="${esc(g.concepto)}"></label><label class="field">Monto mensual ($)<input data-k="monto" inputmode="decimal" value="${esc(g.monto)}"></label></div>`;
  const body = `<div class="fgrid"><label class="field">Nombre<input id="m-nom" value="${esc(m.nombre)}" placeholder="Ej.: Máquina 2 · Colegio"></label><label class="field">Ubicación<input id="m-ubi" value="${esc(m.ubicacion)}"></label>
   <label class="field">Cantidad de slots<input id="m-n" inputmode="numeric" value="${esc(m.cantidadSlots||60)}"></label><label class="field">Alquiler mensual ($)<input id="m-alq" inputmode="decimal" value="${esc(m.alquiler)}" placeholder="A definir"></label></div>
   <fieldset class="card" style="margin:0"><legend class="small muted" style="padding:0 6px">Medios de pago</legend><div class="row">${[["qr","QR"],["efectivo","Efectivo"],["tarjeta","Tarjeta"]].map(([k,l])=>`<label class="row" style="gap:6px;min-height:44px"><input type="checkbox" data-mp="${k}" ${(m.mediosPago||[]).includes(k)?"checked":""}> ${l}</label>`).join("")}</div></fieldset>
   <div><h3>Otros gastos mensuales</h3><div id="m-gs" style="display:flex;flex-direction:column;gap:10px;margin-top:8px">${gastos.map(gRow).join("")}</div><button class="btn" type="button" id="m-addg" style="margin-top:10px">Agregar gasto</button></div>`;
  openDrawer(mid ? "Editar " + m.nombre : "Nueva máquina", body, `${mid?`<button class="btn ghost danger" type="button" id="m-del">Borrar</button>`:""}<button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="m-ok">Guardar</button>`, (d, close) => {
    setTimeout(() => { const i = $("#m-nom", d); if (i){ i.focus(); i.select(); } }, 30);
    $("#m-addg", d).addEventListener("click", () => { gastos.push({concepto:"", monto:null}); const w = document.createElement("div"); w.innerHTML = gRow(gastos[gastos.length-1], gastos.length-1); $("#m-gs", d).appendChild(w.firstElementChild); });
    const dl = $("#m-del", d); if (dl) dl.addEventListener("click", () => { close(); confirmar("¿Borrar la máquina " + m.nombre + " y su planograma? Sus ventas quedan en el historial.", async () => { await del("maquinas/"+mid, "Máquina borrada"); UI.maq = null; render(); }); });
    $("#m-ok", d).addEventListener("click", async () => { const nombre = $("#m-nom",d).value.trim(); if (!nombre){ toast("Falta el nombre"); return; }
      d.querySelectorAll("[data-g]").forEach(el => { const g = gastos[+el.dataset.g]; g.concepto = el.querySelector('[data-k="concepto"]').value.trim(); g.monto = num(el.querySelector('[data-k="monto"]').value); });
      const id = mid || uid(); const data = Object.assign({}, m, {nombre, ubicacion: $("#m-ubi",d).value.trim(), cantidadSlots: Math.max(1, Math.min(200, num($("#m-n",d).value) || 60)), alquiler: num($("#m-alq",d).value),
        mediosPago: [...d.querySelectorAll("[data-mp]")].filter(x=>x.checked).map(x=>x.dataset.mp), otrosGastos: gastos.filter(g=>g.concepto && g.monto!=null)});
      if (await save("maquinas/"+id, data, "Máquina guardada")){ if (!mid) UI.maq = id; close(); render(); } });
  });
}

// ---------- arranque ----------
renderNav(); render();
window.addEventListener("hashchange", setRoute);
const COLS = ["productos","stock","relev","competidores","proveedores","maquinas","config"];
(async function(){
  const C = window.claude; if (!C || !C.use){ $("#view").innerHTML = `<div class="empty">Abrí esta app desde claude.ai para ver y guardar tus datos.</div>`; return; }
  db = await C.use("db");
  if (!db){ $("#view").innerHTML = `<div class="empty">No se pudo conectar con la base de datos. Recargá la página.</div>`; return; }
  C.use("assets").then(a => { assets = a; });
  C.use("downloads").then(x => { downloads = x; });
  C.use("user").then(u => { if (u && u.canEdit && !u.canEdit()){ S.ro = true; renderNav(); render(); } }).catch(()=>{});
  const got = new Set(); const total = COLS.length + 1;
  const listo = (k) => { got.add(k); if (got.size === total) S.ready = true; if (S.ready) render(); };
  const err = (e) => { if (e && e.code !== "unavailable") toast("Se cortó la conexión con los datos. Recargá la página."); };
  for (const col of COLS){
    db.collection(col).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      if (col === "config") S.config = o.general || {}; else S[col] = o; listo(col); }, err);
  }
  // Ventas: un documento por día (todos, para el historial)
  db.collection("ventasdia").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S.vdias = o; listo("ventas"); }, err);
  setRoute();
})();
})();
</script>
