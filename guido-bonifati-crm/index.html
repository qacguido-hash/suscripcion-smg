<title>CRM Guido Bonifati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link id="manifestLink" rel="manifest">
<link id="appleIconLink" rel="apple-touch-icon">
<link id="faviconLink" rel="icon">
<meta name="theme-color" content="#34506B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM Guido">
<script>
(function(){
  function makeIcon(size){
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#5B6472'); g.addColorStop(1,'#34506B');
    ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#C9A227';
    ctx.font = '700 ' + Math.round(size*0.42) + 'px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GB', size/2, size/2 + size*0.02);
    return c.toDataURL('image/png');
  }
  try {
    var icon192 = makeIcon(192);
    var icon512 = makeIcon(512);
    var manifest = {
      name: 'CRM Guido Bonifati', short_name: 'CRM Guido',
      start_url: location.href, display: 'standalone',
      background_color: '#F6F7F9', theme_color: '#34506B',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png' },
        { src: icon512, sizes: '512x512', type: 'image/png' }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);
    document.getElementById('appleIconLink').href = icon192;
    document.getElementById('faviconLink').href = icon192;
  } catch (e) { /* icon generation is best-effort */ }
})();
</script>
<style>
  :root{
    --blue:#34506B; --blue-deep:#243A4E;
    --gray:#5B6472; --gray-deep:#454C57;
    --yellow:#C9A227; --yellow-deep:#A9871C;
    --text:#454B52; --muted:#82868D;
    --bg:#ffffff; --surface:#F6F7F9; --surface2:#EEF0F2; --border:#E4E6EA;
    --ok:#1a7a3c; --ok-bg:#E9F6EE;
    --warn:#B4790E; --warn-bg:#FDF3E1;
    --danger:#b0303a; --danger-bg:#FBEAEC;
    --font:'Saira',sans-serif; --font-cond:'Saira Condensed',sans-serif;
    --radius:10px; --shadow:0 10px 30px rgba(40,55,70,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--font);color:var(--text);background:var(--surface);line-height:1.5;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  button{font-family:var(--font);cursor:pointer;}
  ul{list-style:none;}
  input,select,textarea{font-family:var(--font);}
  [hidden]{display:none!important;}

  /* Layout: sidebar + main */
  #app{min-height:100vh;}
  .app-shell{display:flex;min-height:100vh;}
  .main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
  .mobile-topbar{display:none;}
  .sidebar-backdrop{display:none;}
  header.top{
    width:230px;flex-shrink:0;position:sticky;top:0;height:100vh;z-index:40;
    background:#fff;border-right:1px solid var(--border);overflow-y:auto;
  }
  .top-inner{display:flex;flex-direction:column;align-items:stretch;gap:18px;padding:20px 14px;height:100%;}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:0 4px;}
  .brand-mark{height:34px;width:34px;flex-shrink:0;display:block;object-fit:contain;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-name{font-family:var(--font-cond);font-weight:600;font-size:17px;color:var(--blue);}
  .brand-tag{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--yellow-deep);}
  nav.tabs{display:flex;flex-direction:column;gap:2px;overflow-x:visible;flex:1;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:none;border:none;padding:10px 12px;border-radius:6px;font-size:13px;font-weight:600;
    color:var(--muted);white-space:nowrap;transition:background .15s,color .15s;text-align:left;
  }
  nav.tabs button:hover{background:var(--surface);color:var(--text);}
  nav.tabs button.active{background:var(--blue);color:#fff;}
  nav.tabs button{position:relative;}
  .alert-banner{display:flex;align-items:center;gap:10px;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius);padding:11px 16px;margin-bottom:18px;font-size:13px;font-weight:600;flex-wrap:wrap;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .sync-dot.ok{background:var(--ok);}
  .sync-dot.off{background:var(--danger);}
  .sync-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-shrink:0;padding:0 4px;}

  main{flex:1;max-width:1400px;margin:0 auto;padding:24px 32px 80px;width:100%;}
  .page{display:none;}
  .page.active{display:block;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-family:var(--font-cond);font-size:26px;font-weight:600;color:var(--blue);}
  .page-head p{font-size:13px;color:var(--muted);margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 16px;border-radius:5px;font-weight:600;font-size:13px;border:1.5px solid transparent;
    cursor:pointer;transition:transform .1s,background .15s;white-space:nowrap;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-deep);}
  .btn-outline{background:#fff;border-color:var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--blue);color:var(--blue);}
  .btn-danger-outline{background:#fff;border-color:var(--danger);color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger-bg);}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn-danger:hover{opacity:.9;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .stat-card b{display:block;font-family:var(--font-cond);font-size:28px;font-weight:600;color:var(--blue);}
  .stat-card span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .panel h2{font-family:var(--font-cond);font-size:16px;font-weight:600;color:var(--text);margin-bottom:12px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .bar-row .label{width:130px;flex-shrink:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;}
  .bar-fill{height:100%;background:var(--blue);border-radius:4px;}
  .bar-row .val{width:56px;text-align:right;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums;}
  .empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center;}

  /* Backups */
  .backup-mini{margin-top:6px;padding-top:10px;border-top:1px dashed var(--border);}
  .backup-mini summary{cursor:pointer;font-size:11.5px;color:var(--muted);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .backup-mini summary::-webkit-details-marker{display:none;}
  .backup-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:6px 0;font-size:11.5px;}
  .backup-row:last-child{border-bottom:none;}
  .backup-row .meta{color:var(--muted);}

  /* Tables / lists */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar input[type="search"],.toolbar select{
    padding:8px 12px;border-radius:5px;border:1px solid var(--border);font-size:13px;background:#fff;color:var(--text);
  }
  .table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);
    padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap;
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface);}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--blue);color:var(--blue);}
  .icon-btn svg{width:14px;height:14px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-muted{background:var(--surface2);color:var(--muted);}

  /* Cards (mobile list fallback / kanban-ish) */
  .card-list{display:grid;gap:10px;}
  .item-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .item-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .item-card h3{font-family:var(--font-cond);font-size:15px;font-weight:600;color:var(--text);}
  .item-card p{font-size:12.5px;color:var(--muted);}
  .item-card .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text);}
  .item-card .meta b{color:var(--blue);}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(30,40,50,0.45);z-index:100;
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;
  }
  .modal{
    background:#fff;border-radius:var(--radius);max-width:560px;width:100%;box-shadow:var(--shadow);
    padding:26px 26px 22px;
  }
  .modal h2{font-family:var(--font-cond);font-size:19px;font-weight:600;color:var(--blue);margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border-radius:5px;border:1px solid var(--border);font-size:13.5px;
    outline:none;color:var(--text);background:#fff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .money-input-wrap{position:relative;}
  .money-prefix{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13.5px;pointer-events:none;}
  .money-input{padding-left:34px !important;text-align:left;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* Detail drawer */
  #drawerBackdrop{position:fixed;inset:0;background:rgba(30,40,50,0.4);z-index:90;display:flex;justify-content:flex-end;}
  #drawer{width:min(440px,100%);background:#fff;height:100%;overflow-y:auto;padding:24px;box-shadow:-8px 0 30px rgba(0,0,0,.12);}
  #drawer h2{font-family:var(--font-cond);font-size:20px;color:var(--blue);margin-bottom:4px;}
  #drawer .sub{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  #drawer .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  #drawer .kv span:first-child{color:var(--muted);}
  #drawer .close-drawer{position:absolute;top:16px;right:16px;}

  /* Toast */
  #toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue-deep);color:#fff;
    padding:11px 20px;border-radius:6px;font-size:13px;z-index:200;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* Calendar mini */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:10px;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1;border-radius:6px;background:var(--surface);font-size:11px;padding:4px;position:relative;
    display:flex;flex-direction:column;
  }
  .cal-cell.today{outline:2px solid var(--blue);}
  .cal-cell .n{font-weight:600;color:var(--text);}
  .cal-cell.other-month{opacity:.35;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--yellow-deep);position:absolute;bottom:4px;left:4px;}

  section.login-gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--surface);
  }
  .login-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow);}
  .login-box .brand-mark{margin:0 auto 14px;width:52px;height:52px;font-size:20px;}
  .login-box h1{font-family:var(--font-cond);font-size:20px;color:var(--blue);margin-bottom:4px;}
  .login-box p{font-size:13px;color:var(--muted);margin-bottom:18px;}

  @media (max-width:900px){
    header.top{position:fixed;top:0;left:-250px;width:230px;height:100vh;transition:left .2s ease;box-shadow:none;}
    header.top.open{left:0;box-shadow:8px 0 28px rgba(20,25,35,0.18);}
    .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(20,25,35,0.4);z-index:39;}
    .sidebar-backdrop[hidden]{display:none;}
    .mobile-topbar{
      display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;
      border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
    }
    .mobile-topbar .icon-btn{width:34px;height:34px;font-size:16px;}
  }
  @media (max-width:720px){
    main{padding:18px 14px 90px;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tbody tr{border-bottom:1px solid var(--border);padding:10px 4px;}
    tbody td{border:none;padding:4px 10px;display:flex;justify-content:space-between;gap:10px;}
    tbody td::before{content:attr(data-label);font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;}
    tbody td.no-label::before{content:none;}
  }
</style>

<div id="app"></div>
<div id="toast"></div>

  function fmtMoney(n, currency){
    n = Number(n) || 0;
    const symbol = currency === 'USD' ? 'US$' : '$';
    return symbol + n.toLocaleString('es-AR', { maximumFractionDigits: 0 });
  }
  function fmtMoneyInput(n){
    n = Number(n) || 0;
    return n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function parseMoneyInput(str){
    if (str == null || str === '') return 0;
    let s = String(str).trim();
    if (s.includes(',')){
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      const parts = s.split('.');
      if (parts.length > 2){
        s = parts.join('');
      } else if (parts.length === 2 && parts[1].length === 3){
        s = parts.join('');
      }
    }
    s = s.replace(/[^0-9.\-]/g, '');
    return Number(s) || 0;
  }

      </div>

  }
  function bindMoneyInputs(root){

  function fmtDate(d){
    if (!d) return '—';

  }
  function fmtDateTime(iso){
    if (!iso) return '—';
    const dt = new Date(iso);

    return dt.toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  function openModal(title, fieldsHtml, onSubmit, opts){
    opts = opts || {};
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <form class="modal">
        <h2>${esc(title)}</h2>
        ${fieldsHtml}
        <div class="modal-actions">
          ${opts.onDelete ? '<button type="button" class="btn btn-danger-outline" data-act="del">Eliminar</button>' : ''}
          <button type="button" class="btn btn-outline" data-act="cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">${opts.submitLabel || 'Guardar'}</button>
        </div>
      </form>`;
    document.body.appendChild(backdrop);
    const form = backdrop.querySelector('form');
    bindMoneyInputs(form);
    form.querySelector('[data-act="cancel"]').addEventListener('click', () => backdrop.remove());
    if (opts.onDelete){
      const delBtn = form.querySelector('[data-act="del"]');
      let confirming = false;
      let revertTimer = null;
      function resetDelBtn(){
        confirming = false;
        delBtn.disabled = false;
        delBtn.textContent = 'Eliminar';
        delBtn.classList.remove('btn-danger');
        delBtn.classList.add('btn-danger-outline');
      }
      delBtn.addEventListener('click', async () => {
        if (!confirming){
          confirming = true;
          delBtn.textContent = '¿Seguro? Eliminar';
          delBtn.classList.remove('btn-danger-outline');
          delBtn.classList.add('btn-danger');
          revertTimer = setTimeout(resetDelBtn, 4000);
          return;
        }
        clearTimeout(revertTimer);
        delBtn.disabled = true;
        try {
          await opts.onDelete();
          backdrop.remove();
        } catch (err) {
          toast('Error al eliminar: ' + (err && err.message ? err.message : 'intentá de nuevo'));
          resetDelBtn();
        }
      });
    }
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = {};
      form.querySelectorAll('[name]').forEach(el => {
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else if (el.dataset.moneyField != null) data[el.name] = parseMoneyInput(el.value);
        else data[el.name] = el.value;
      });
      const submitBtn = form.querySelector('[type="submit"]');
      const originalLabel = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando…';
      try {
        await onSubmit(data);
        backdrop.remove();
      } catch (err) {
        toast('Error al guardar: ' + (err && err.message ? err.message : 'intentá de nuevo'));
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    });
    return backdrop;
  }

  function crossSellSuggestions(c, pols){
    const active = pols.filter(p => p.status !== 'cancelada');
    const ramos = new Set(active.map(p => p.ramo));
    const suggestions = [];
    const add = (ramo, text) => suggestions.push({ ramo, text });
    if (c.type === 'empresa'){
      if (active.length && !ramos.has('Seguro de ART')) add('Seguro de ART', 'Es empresa y no tiene ART contratada.');
      if (active.length && !ramos.has('Responsabilidad Civil')) add('Responsabilidad Civil', 'No tiene Responsabilidad Civil contratada.');
      if (ramos.has('Todo Riesgo Operativo') && !ramos.has('Seguro Técnico')) add('Seguro Técnico', 'Tiene Todo Riesgo Operativo, pero no Seguro Técnico.');
    } else {
      const hasVehicle = ramos.has('Seguro de Auto') || ramos.has('Seguro de Moto');
      const hasHome = ramos.has('Combinado Familiar');
      const vehiclePol = active.find(p => (p.ramo === 'Seguro de Auto' || p.ramo === 'Seguro de Moto') && p.vehicleYear);
      const vehicleAge = vehiclePol ? new Date().getFullYear() - Number(vehiclePol.vehicleYear) : null;
      if (hasVehicle && !hasHome){
        const text = vehicleAge != null
          ? `Tu ${vehiclePol.ramo === 'Seguro de Moto' ? 'moto' : 'auto'} tiene ${vehicleAge} años — ¿querés considerar un Combinado Familiar para el hogar?`
          : 'Tiene auto/moto, pero no seguro del hogar (Combinado Familiar).';
        add('Combinado Familiar', text);
      }
      if (hasVehicle && hasHome && !ramos.has('Accidentes Personales')) add('Accidentes Personales', 'Tiene auto/moto y combinado familiar, pero no Accidentes Personales.');
      if (hasVehicle && hasHome && !ramos.has('Seguro de Vida')) add('Seguro de Vida', 'Tiene auto/moto y combinado familiar, pero no Seguro de Vida.');
      if (ramos.has('Seguro de Vida') && !ramos.has('Accidentes Personales')) add('Accidentes Personales', 'Tiene Seguro de Vida, pero no Accidentes Personales.');
      if (c.birthday){
        const age = Math.floor((Date.now() - new Date(c.birthday + 'T00:00:00').getTime()) / (365.25*24*3600*1000));
        if (age > 45 && !ramos.has('Seguro de Retiro')) add('Seguro de Retiro', `Tiene ${age} años y no tiene Seguro de Retiro.`);
      }
    }
    const seen = new Set();
    return suggestions.filter(s => { if (seen.has(s.ramo)) return false; seen.add(s.ramo); return true; });
  }
  function phoneToWhatsApp(phone){

    return digits;
  }

  const BACKUP_CHUNK_CHARS = 250000;
  const BACKUPS_TO_KEEP = 30;
  async function createBackup(auto){
    if (!db) return;
    try {
      const dump = {
        exportedAt: new Date().toISOString(),
        clients: state.clients, policies: state.policies, quotes: state.quotes,
        tasks: state.tasks, interactions: state.interactions, documents: state.documents, claims: state.claims,
        insurers: state.insurers, goals,
      };
      const json = JSON.stringify(dump);
      const createdAt = new Date().toISOString();
      let ref;
      if (json.length <= BACKUP_CHUNK_CHARS){
        ref = await db.collection('backups').add({ createdAt, auto: !!auto, size: json.length, chunked: false, data: json });
      } else {
        ref = await db.collection('backups').add({ createdAt, auto: !!auto, size: json.length, chunked: true, chunkCount: 0 });
        const total = Math.ceil(json.length / BACKUP_CHUNK_CHARS);
        for (let i = 0; i < total; i++){
          await db.collection('backupChunks').add({ backupId: ref.id, index: i, data: json.slice(i*BACKUP_CHUNK_CHARS, (i+1)*BACKUP_CHUNK_CHARS) });
        }
        await db.collection('backups').doc(ref.id).update({ chunkCount: total });
      }
      backupMeta = { lastBackupAt: createdAt, lastBackupAuto: !!auto };
      await db.doc('settings/backupMeta').set(backupMeta);
      await pruneOldBackups();
      if (!auto) toast('Backup creado.');
    } catch (e) {
      console.error('createBackup', e);
      if (!auto) toast('No se pudo crear el backup.');
    }
  }
  async function pruneOldBackups(){
    const sorted = state.backups.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    const toDelete = sorted.slice(BACKUPS_TO_KEEP);
    for (const b of toDelete){
      try {
        if (b.chunked){
          const snap = await db.collection('backupChunks').where('backupId','==',b.id).get();
          for (const s of snap.docs){ await db.collection('backupChunks').doc(s.id).delete(); }
        }
        await db.collection('backups').doc(b.id).delete();
      } catch (e) { console.error('pruneOldBackups', e); }
    }
  }
  async function downloadBackup(id){
    const b = state.backups.find(x => x.id === id);
    if (!b) return;
    let json;
    try {
      if (b.chunked){
        const snap = await db.collection('backupChunks').where('backupId','==',id).orderBy('index').get();
        json = snap.docs.map(s => s.data().data).join('');
      } else {
        json = b.data;
      }
    } catch (e) { toast('No se pudo leer ese backup.'); return; }
    const downloads = await claude.use('downloads');
    if (!downloads){ toast('La descarga no está disponible en esta vista.'); return; }
    try {
      await downloads.save({ filename: `crm-guido-bonifati-backup-${(b.createdAt||'').replace(/[:.]/g,'-')}.json`, data: json });
      toast('Backup descargado.');
    } catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar el backup.'); }
  }

  function parseCsv(text){
    text = text.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"'){
        inQuotes = true;
      } else if (c === ','){
        row.push(field); field = '';
      } else if (c === '\n'){
        row.push(field); rows.push(row); row = []; field = '';
      } else {
        field += c;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length === 1 && r[0] === ''));
  }

          await db.collection('clients').add(data);

  function openImportPoliciesForm(){
    const backdrop = openModal('Importar pólizas (CSV)', `
      <p class="sub" style="margin-bottom:10px;">Columnas esperadas (en cualquier orden): Cliente, Ramo, Aseguradora, N° póliza, Prima, Moneda, Comisión %, Medio de pago, Cuotas, Cuotas pagadas, Estado, Inicio de vigencia, Vencimiento (fechas en AAAA-MM-DD). Si el cliente no existe todavía, se crea automáticamente solo con el nombre.</p>
      <div class="field"><input type="file" id="importFile" accept=".csv,text/csv"></div>
      <p id="importSummary" class="sub" style="margin-top:10px;"></p>
    `, async () => {}, { submitLabel: 'Cerrar' });
    const summary = backdrop.querySelector('#importSummary');
    backdrop.querySelector('#importFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      summary.textContent = 'Importando…';
      try {
        const text = await file.text();
        const rows = parseCsv(text);
        if (!rows.length){ summary.textContent = 'El archivo está vacío.'; return; }
        const header = rows[0].map(h => h.trim().toLowerCase());
        const idx = name => header.indexOf(name);
        const iClient = idx('cliente'), iRamo = idx('ramo'), iCompany = idx('aseguradora');
        const iNum = idx('n° póliza') >= 0 ? idx('n° póliza') : idx('numero de poliza');
        const iPremium = idx('prima'), iCurrency = idx('moneda');
        const iComm = idx('comisión %') >= 0 ? idx('comisión %') : idx('comision %');
        const iMethod = idx('medio de pago'), iInst = idx('cuotas'), iInstPaid = idx('cuotas pagadas');
        const iStatus = idx('estado'), iStart = idx('inicio de vigencia'), iEnd = idx('vencimiento');
        if (iClient < 0){ summary.textContent = 'Falta la columna "Cliente".'; return; }
        let created = 0, clientsCreated = 0;
        for (let i = 1; i < rows.length; i++){
          const r = rows[i];
          const clientNameVal = (r[iClient]||'').trim();
          if (!clientNameVal) continue;
          let client = state.clients.find(c => c.name.toLowerCase() === clientNameVal.toLowerCase());
          if (!client){
            const ref = await db.collection('clients').add({ name: clientNameVal, type:'persona', createdAt: new Date().toISOString() });
            client = { id: ref.id, name: clientNameVal };
            state.clients.push(client);
            clientsCreated++;
          }
          const data = {
            clientId: client.id, clientName: client.name,
            ramo: iRamo>=0?(r[iRamo]||'').trim():'', company: iCompany>=0?(r[iCompany]||'').trim():'',
            policyNumber: iNum>=0?(r[iNum]||'').trim():'',
            premium: iPremium>=0?Number(r[iPremium])||0:0,
            currency: iCurrency>=0 && (r[iCurrency]||'').trim().toUpperCase()==='USD' ? 'USD' : 'ARS',
            commissionPct: iComm>=0?Number(r[iComm])||0:0,
            paymentMethod: iMethod>=0?(r[iMethod]||'').trim():'',
            installments: iInst>=0?Math.max(1,Number(r[iInst])||1):1,
            installmentsPaid: iInstPaid>=0?Math.max(0,Number(r[iInstPaid])||0):0,
            status: iStatus>=0 && /cancel/i.test(r[iStatus]||'') ? 'cancelada' : 'activa',
            startDate: iStart>=0?(r[iStart]||'').trim():'', endDate: iEnd>=0?(r[iEnd]||'').trim():'',
            createdAt: new Date().toISOString(),
          };
          await db.collection('policies').add(data);
          created++;
        }
        summary.textContent = `Listo: ${created} pólizas importadas${clientsCreated?`, ${clientsCreated} clientes nuevos creados automáticamente`:''}.`;
        toast('Importación de pólizas finalizada.');
      } catch (err){
        summary.textContent = 'Error al importar: ' + (err && err.message ? err.message : 'revisá el archivo.');
      }
    });
  }

  /* ==================== POLIZAS ==================== */
  function policyStatusInfo(p){
    if (p.status === 'cancelada') return { label:'Cancelada', cls:'badge-muted' };
    if (p.autoRenew) return { label:'Vigente (auto)', cls:'badge-ok' };
    const d = daysUntil(p.endDate);
    if (d === null) return { label:'Sin fecha', cls:'badge-muted' };
    if (d < 0) return { label:'Vencida', cls:'badge-danger' };
    if (d <= 30) return { label:`Vence en ${d}d`, cls:'badge-warn' };
    return { label:'Vigente', cls:'badge-ok' };
  }
  function installmentStatus(p){
    const total = Math.max(1, Number(p.installments)||1);
    const paid = Math.min(total, Math.max(0, Number(p.installmentsPaid)||0));
    if (paid >= total) return { label: `${paid}/${total}`, cls:'badge-ok', mora:false };
    let expected = total;
    if (p.startDate){
      const start = new Date(p.startDate + 'T00:00:00');
      const now = new Date();
      let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
      if (now.getDate() < start.getDate()) months -= 1;
      expected = Math.min(total, Math.max(1, months+1));
    }
    const mora = paid < expected;
    return { label: `${paid}/${total}${mora ? ' · Mora' : ''}`, cls: mora ? 'badge-danger' : 'badge-warn', mora };
  }
  function nextInstallmentDueDate(p){
    const total = Number(p.installments)||1;
    const paid = Number(p.installmentsPaid)||0;
    if (paid >= total || !p.startDate) return null;
    const start = new Date(p.startDate + 'T00:00:00');
    const due = new Date(start);
    due.setMonth(due.getMonth() + paid);
    return due;
  }

      installmentsPaid: 0, status: 'activa', policyNumber: '',
      startDate: toISO(newStart), endDate: toISO(newEnd), notes: old.notes || '',
    });
  }

  /* ==================== COTIZACIONES ==================== */
  const REJECTION_REASONS = ['Precio','Cobertura','Competencia','No le interesa','Otro'];
  function defaultTaxPctForRamo(ramo){
    if (ramo === 'Seguro de Vida' || ramo === 'Vida Colectivo' || ramo === 'Seguro de Retiro') return 2;
    return 21;
  }
  function quotePremio(q){
    const prima = Number(q.premium) || 0;
    const taxPct = q.taxPct != null ? Number(q.taxPct) || 0 : defaultTaxPctForRamo(q.ramo);
    const taxes = prima * taxPct / 100;
    const hasRealPremio = !!q.premioTotal;
    const premio = hasRealPremio ? Number(q.premioTotal) || 0 : prima + taxes;
    const otros = hasRealPremio ? premio - (prima + taxes) : 0;
    return { prima, taxPct, taxes, otros, premio };
  }

  function renderConversionRanking(){
    const el = document.querySelector('.page[data-page="cotizaciones"]');
    const panel = el.querySelector('#quoteConversionPanel');
    const decided = state.quotes.filter(q => q.status === 'aceptada' || q.status === 'rechazada');
    if (!decided.length){ panel.innerHTML = ''; return; }
    function rankBy(field){
      const map = {};
      decided.forEach(q => {
        const key = q[field] || '—';
        if (!map[key]) map[key] = { total:0, aceptadas:0 };
        map[key].total++;
        if (q.status === 'aceptada') map[key].aceptadas++;
      });
      return Object.entries(map).sort((a,b) => b[1].total - a[1].total);
    }
    const totalAceptadas = decided.filter(q => q.status === 'aceptada').length;
    const overallPct = Math.round(totalAceptadas / decided.length * 100);
    function rankTable(title, rows){
      return `
        <div class="panel" style="flex:1;min-width:240px;">
          <h2>${title}</h2>
          ${rows.map(([name,d]) => {
            const pct = Math.round(d.aceptadas / d.total * 100);
            return `<div class="bar-row">
              <span class="label">${esc(name)}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
              <span class="val">${pct}% (${d.aceptadas}/${d.total})</span>
            </div>`;
          }).join('')}
        </div>`;
    }
    panel.innerHTML = `
      <div class="panel" style="margin-bottom:14px;">
        <h2>Conversión de cotizaciones</h2>
        <div class="stat-grid" style="margin-bottom:10px;">
          <div class="stat-card"><b>${overallPct}%</b><span>Conversión general</span></div>
          <div class="stat-card"><b>${totalAceptadas}</b><span>Aceptadas</span></div>
          <div class="stat-card"><b>${decided.length - totalAceptadas}</b><span>Rechazadas</span></div>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
          ${rankTable('Por ramo', rankBy('ramo'))}
          ${rankTable('Por aseguradora', rankBy('company'))}
        </div>
      </div>
    `;
  }
  const QUOTE_BADGE = { pendiente:'badge-muted', enviada:'badge-warn', aceptada:'badge-ok', rechazada:'badge-danger' };
  function renderQuoteList(){

  function openConvertQuoteChoice(q){
    const clientPols = state.policies.filter(p => p.clientId === q.clientId && p.status !== 'cancelada');
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>Convertir cotización en póliza</h2>
        <p class="sub" style="margin-bottom:14px;">¿Esta cotización es para emitir una póliza nueva, o es un endoso / cambio (aseguradora, suma asegurada, etc.) sobre una póliza que el cliente ya tiene?</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button type="button" class="btn btn-primary" data-act="new" style="width:100%;">Emitir póliza nueva</button>
          ${clientPols.length ? `<button type="button" class="btn btn-outline" data-act="existing" style="width:100%;">Modificar una póliza existente (endoso)</button>` : ''}
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" data-act="cancel">Cancelar</button></div>
      </div>`;

  }
  function openConvertQuotePickPolicy(q, clientPols){
    openModal('¿Qué póliza modificamos?', `
      <div class="field"><label>Póliza a modificar</label><select name="targetPolicyId" required>
        ${clientPols.map(p => `<option value="${p.id}">${esc(p.ramo)} · ${esc(p.company)}${p.policyNumber?' · N° '+esc(p.policyNumber):''}</option>`).join('')}
      </select></div>
      <p class="sub">Se abre esa póliza para editar, con los datos nuevos de la cotización (aseguradora, prima, premio, suma asegurada) ya cargados — revisá y guardá los cambios.</p>
    `, async data => {
      const target = clientPols.find(p => p.id === data.targetPolicyId);
      if (!target) throw new Error('Elegí una póliza.');
      await db.collection('quotes').doc(q.id).update({ convertedToPolicyId: target.id });
      openPolicyForm(Object.assign({}, target, {
        ramo: q.ramo, company: q.company, premium: q.premium,

  function convertQuoteToPolicy(q){

      notes: q.coverageNotes || '', sourceQuoteId: q.id,
    });
  }

    const backdrop = openModal(existing ? 'Editar cotización' : 'Nueva cotización', `

  async function generateQuotePdf(q){
    if (!window.jspdf){ toast('No se pudo cargar el generador de PDF.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const client = state.clients.find(c => c.id === q.clientId);
    let y = quotePdfHeader(doc, q);
    y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    const rows = [
      ['Cliente', clientName(q.clientId)],
      ['DNI/CUIT', (client && client.docId) || '—'],
      ['Ramo', q.ramo || '—'],
      ['Aseguradora', q.company || '—'],
      ['Suma asegurada', q.sumInsured ? fmtMoney(q.sumInsured) : '—'],
      ['Fecha', fmtDate(new Date().toISOString().slice(0,10))],
    ];
    rows.forEach(([k,v]) => {
      doc.setFont('helvetica','bold'); doc.text(k + ':', 14, y);
      doc.setFont('helvetica','normal'); doc.text(String(v), 60, y);
      y += 3;
      doc.setDrawColor(230,230,230); doc.setLineWidth(0.15); doc.line(14, y, 196, y); doc.setLineWidth(0.2);
      y += 5;
    });
    y += 4;
    const hasRealPremio = !!q.premioTotal;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(`Detalle de costos${hasRealPremio ? '' : ' (estimado)'}`, 14, y); y += 10;
    const costsBoxTop = y - 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    const { prima, taxPct, taxes, otros, premio } = quotePremio(q);
    doc.text('Prima:', 20, y); doc.text(fmtMoney(prima), 190, y, { align:'right' }); y += 7;
    doc.text(`Impuestos y recargos (${taxPct}%):`, 20, y); doc.text(fmtMoney(taxes), 190, y, { align:'right' }); y += 7;
    if (hasRealPremio && Math.abs(otros) >= 1){
      doc.text('Otros conceptos:', 20, y); doc.text(fmtMoney(otros), 190, y, { align:'right' }); y += 7;
    }
    doc.setDrawColor(220,220,220); doc.line(20, y, 190, y); y += 7;
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(`Premio total${hasRealPremio ? '' : ' estimado'}:`, 20, y); doc.text(fmtMoney(premio), 190, y, { align:'right' }); y += 6;
    doc.setDrawColor(221,221,221); doc.setLineWidth(0.3);
    doc.roundedRect(14, costsBoxTop, 182, y - costsBoxTop + 2, 1.5, 1.5, 'S');
    doc.setLineWidth(0.2);
    y += 10;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
    const taxNoteText = hasRealPremio
      ? 'Prima e impuestos son orientativos; el premio total es el informado por la aseguradora. "Otros conceptos" agrupa derechos, recargos u otros ítems no desglosados.'
      : 'Los impuestos y el premio final son estimados y pueden variar según la aseguradora y la provincia; se confirman al emitir la póliza.';
    const taxNote = doc.splitTextToSize(taxNoteText, 182);
    doc.text(taxNote, 14, y); y += taxNote.length * 4 + 8;
    doc.setTextColor(30,30,30); doc.setFontSize(11);
    doc.setFont('helvetica','bold'); doc.text('Detalle de cobertura:', 14, y); y += 7;
    doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(q.coverageNotes || 'Sin detalle adicional.', 182);
    doc.text(lines, 14, y); y += lines.length * 6 + 10;
    doc.setDrawColor(220,220,220); doc.line(14, y, 196, y); y += 8;
    doc.setFontSize(9); doc.setTextColor(120,120,120);
    doc.text('Cotización orientativa, sujeta a análisis y aprobación de la compañía aseguradora.', 14, y);
    y += 18;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(52,80,107);
    doc.text('Guido Bonifati', 196, y, { align:'right' });
    const blob = doc.output('blob');
    const downloads = await claude.use('downloads');
    if (!downloads){ toast('La descarga no está disponible en esta vista.'); return; }
    try {
      await downloads.save({ filename: `cotizacion-${(clientName(q.clientId)||'cliente').replace(/\s+/g,'-').toLowerCase()}.pdf`, data: blob });
      toast('PDF generado.');
    } catch (e) { if (e && e.code !== 'declined') toast('No se pudo guardar el PDF.'); }
  }

  const CLAIM_STATUS_LABEL = { abierto:'Abierto', en_gestion:'En gestión', cerrado:'Cerrado' };
  async function generateClientPdf(c){
    if (!window.jspdf){ toast('No se pudo cargar el generador de PDF.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 0;
    function ensureSpace(needed){ if (y + needed > 280){ doc.addPage(); y = 20; } }
    pdfHeader(doc);
    y = 40;
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Ficha de cliente', 14, y); y += 10;
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    const infoRows = [
      ['Nombre / Razón social', c.name || '—'],
      ['Tipo', c.type === 'empresa' ? 'Empresa' : 'Persona'],
      ['DNI / CUIT', c.docId || '—'],
      ['Email', c.email || '—'],
      ['Teléfono', c.phone || '—'],
      ['Dirección', c.address || '—'],
      ['Cumpleaños', c.birthday ? fmtDate(c.birthday) : '—'],
      ['Etiquetas', (c.tags||[]).length ? c.tags.join(', ') : '—'],
    ];
    infoRows.forEach(([k,v]) => {
      const lines = doc.splitTextToSize(String(v), 120);
      ensureSpace(Math.max(8, lines.length*6));
      doc.setFont('helvetica','bold'); doc.text(k + ':', 14, y);
      doc.setFont('helvetica','normal'); doc.text(lines, 70, y);
      y += Math.max(8, lines.length*6);
    });
    y += 4;

    const pols = state.policies.filter(p => p.clientId === c.id);
    ensureSpace(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(`Pólizas (${pols.length})`, 14, y); y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if (!pols.length){ doc.text('Sin pólizas cargadas.', 14, y); y += 8; }
    const polsByRamo = {};
    pols.forEach(p => { (polsByRamo[p.ramo || 'Sin ramo'] = polsByRamo[p.ramo || 'Sin ramo'] || []).push(p); });
    Object.keys(polsByRamo).sort().forEach(ramo => {
      ensureSpace(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(52,80,107);
      doc.text(ramo, 14, y); y += 6.5;
      doc.setTextColor(30,30,30); doc.setFontSize(10);
      polsByRamo[ramo].forEach(p => {
        ensureSpace(14);
        const s = policyStatusInfo(p);
        doc.setFont('helvetica','bold'); doc.text(p.company || '—', 16, y); y += 5.5;
        doc.setFont('helvetica','normal');
        doc.text(`N° ${p.policyNumber || '—'}   Premio: ${fmtMoney(policyPremio(p), p.currency)}   Vence: ${p.autoRenew ? 'Automática' : fmtDate(p.endDate)}   Estado: ${s.label}`, 16, y); y += 8;
      });
    });
    y += 4;

    const cots = state.quotes.filter(q => q.clientId === c.id);
    ensureSpace(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(`Cotizaciones (${cots.length})`, 14, y); y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if (!cots.length){ doc.text('Sin cotizaciones.', 14, y); y += 8; }
    cots.forEach(q => {
      ensureSpace(10);
      doc.text(`${q.ramo || '—'} · ${q.company || '—'} — ${fmtMoney(q.premium)} — Estado: ${q.status || '—'}`, 14, y); y += 7;
    });
    y += 4;

    const clms = state.claims.filter(x => x.clientId === c.id);
    ensureSpace(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(`Siniestros (${clms.length})`, 14, y); y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if (!clms.length){ doc.text('Sin siniestros registrados.', 14, y); y += 8; }
    clms.forEach(cl => {
      ensureSpace(10);
      doc.text(`${fmtDate(cl.date)} — Estado: ${CLAIM_STATUS_LABEL[cl.status] || cl.status || '—'} — Monto: ${fmtMoney(cl.amount)}`, 14, y); y += 7;
    });

    const blob = doc.output('blob');
    const downloads = await claude.use('downloads');
    if (!downloads){ toast('La descarga no está disponible en esta vista.'); return; }
    try {
      await downloads.save({ filename: `ficha-${(c.name||'cliente').replace(/\s+/g,'-').toLowerCase()}.pdf`, data: blob });
      toast('Ficha generada.');
    } catch (e) { if (e && e.code !== 'declined') toast('No se pudo guardar la ficha.'); }
  }

  const TASK_TYPE_LABEL = { llamado:'Llamado', recordatorio:'Recordatorio', reunion:'Reunión', vencimiento:'Vencimiento', otro:'Otro' };
  function renderTaskList(){
    const el = document.querySelector('.page[data-page="tareas"]');
    const f = el.querySelector('#taskFilter').value;
    let rows = state.tasks.slice();
    if (f === 'pending') rows = rows.filter(t => !t.done);
    if (f === 'done') rows = rows.filter(t => t.done);
    rows.sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
    const list = el.querySelector('#taskList');
    if (!rows.length){ list.innerHTML = '<p class="empty">No hay tareas para mostrar.</p>'; return; }
    list.innerHTML = rows.map(t => {
      const d = daysUntil(t.dueDate);
      const overdue = !t.done && d !== null && d < 0;
      return `
      <div class="item-card">
        <div class="top-row">
          <div>
            <h3 style="${t.done ? 'text-decoration:line-through;color:var(--muted);' : ''}">${esc(t.title)}</h3>
            <p>${TASK_TYPE_LABEL[t.type]||'Otro'}${t.clientId ? ' · ' + esc(clientName(t.clientId)) : ''}</p>
          </div>
          <span class="badge ${t.done ? 'badge-ok' : overdue ? 'badge-danger' : 'badge-muted'}">${t.done ? 'Hecha' : fmtDate(t.dueDate)}</span>
        </div>
        <div class="meta">
          <label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" class="toggle-task" data-id="${t.id}" ${t.done?'checked':''}> Completada</label>
          <button class="btn btn-sm btn-outline edit-task" data-id="${t.id}">Editar</button>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.toggle-task').forEach(cb => cb.addEventListener('change', async () => {
      await db.collection('tasks').doc(cb.dataset.id).update({ done: cb.checked });
    }));
    list.querySelectorAll('.edit-task').forEach(b => b.addEventListener('click', () => {
      const t = state.tasks.find(x => x.id === b.dataset.id); if (t) openTaskForm(t);
    }));
  }
  function renderCalendar(){
    const el = document.querySelector('.page[data-page="tareas"]');
    if (!el.querySelector('#calGrid')) return;
    const label = el.querySelector('#calLabel');
    label.textContent = calMonth.toLocaleDateString('es-AR', { month:'long', year:'numeric' });
    const grid = el.querySelector('#calGrid');
    const dows = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
    let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const gridStart = new Date(first); gridStart.setDate(first.getDate() - startOffset);
    const todayStr = new Date().toISOString().slice(0,10);
    const tasksByDate = {};
    state.tasks.forEach(t => { if (t.dueDate){ (tasksByDate[t.dueDate] = tasksByDate[t.dueDate] || []).push(t); } });
    state.policies.forEach(p => { if (p.endDate && p.status !== 'cancelada'){ (tasksByDate[p.endDate] = tasksByDate[p.endDate] || []).push({title:'Vencimiento póliza'}); } });
    for (let i=0; i<42; i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
      const ds = d.toISOString().slice(0,10);
      const otherMonth = d.getMonth() !== calMonth.getMonth();
      const has = tasksByDate[ds] && tasksByDate[ds].length;
      html += `<div class="cal-cell ${otherMonth?'other-month':''} ${ds===todayStr?'today':''}"><span class="n">${d.getDate()}</span>${has?'<span class="cal-dot"></span>':''}</div>`;
    }
    grid.innerHTML = html;
  }
  function openTaskForm(existing){
    const t = existing || {};
    openModal(existing ? 'Editar tarea' : 'Nueva tarea', `
      <div class="field"><label>Título</label><input name="title" required value="${esc(t.title||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Tipo</label><select name="type">

  const CLIENT_STORAGE_BUDGET = 15 * 1024 * 1024;
  const MAX_FILE_BYTES = CLIENT_STORAGE_BUDGET;
  const CHUNK_B64_CHARS = 250000;
  function docFiles(d){
    if (Array.isArray(d.files)) return d.files;
    if (d.fileName) return [{ id: d.id, name: d.fileName, type: d.fileType, size: d.fileSize, chunkCount: d.chunkCount }];
    return [];
  }
  function clientStorageUsed(clientId, excludeId){
    const sumFrom = arr => arr
      .filter(x => x.clientId === clientId && x.id !== excludeId)
      .reduce((s,x) => s + docFiles(x).reduce((s2,f) => s2 + (Number(f.size)||0), 0), 0);
    return sumFrom(state.documents) + sumFrom(state.policies);
  }
  function newFileId(){
    return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }
  async function withRetry(fn){
    let lastErr;
    for (let i = 0; i < 3; i++){
      try { return await fn(); }
      catch (e){
        lastErr = e;
        if (e && (e.code === 'resource_exhausted' || e.code === 'unavailable')){
          await new Promise(r => setTimeout(r, 350 * (i+1) + Math.random()*250));
          continue;
        }
        throw e;
      }
    }
    throw lastErr;
  }
  async function saveFileChunks(fileId, dataUrl, onProgress){
    const base64 = (dataUrl.split(',')[1] || '');
    const total = Math.max(1, Math.ceil(base64.length / CHUNK_B64_CHARS));
    for (let i = 0; i < total; i++){
      const part = base64.slice(i*CHUNK_B64_CHARS, (i+1)*CHUNK_B64_CHARS);
      await withRetry(() => db.collection('documentChunks').add({ documentId: fileId, index: i, data: part }));
      if (onProgress) onProgress(i+1, total);
    }
    return total;
  }
  async function deleteFileChunks(fileId){
    const snap = await withRetry(() => db.collection('documentChunks').where('documentId','==',fileId).get());
    for (const s of snap.docs){ await withRetry(() => db.collection('documentChunks').doc(s.id).delete()); }
  }
  async function loadFileDataUrl(fileId, fileType, expectedCount){
    const snap = await withRetry(() => db.collection('documentChunks').where('documentId','==',fileId).orderBy('index').get());
    if (expectedCount && snap.docs.length !== expectedCount){
      throw new Error(`faltan partes del archivo (${snap.docs.length} de ${expectedCount}) — volvé a subirlo`);
    }
    const base64 = snap.docs.map(s => s.data().data).join('');
    return `data:${fileType || 'application/octet-stream'};base64,${base64}`;
  }
  function initAttachmentManager(opts){
    // opts: { initialFiles, clientSelectEl, filesListEl, fileInputEl, hintEl, storageHintEl, getExcludeId }
    let attachments = (opts.initialFiles || []).slice();
    let removedIds = [];
    let pendingNewFiles = []; // { localId, name, type, size, base64 }

    function currentTotalSize(){
      return attachments.reduce((s,f) => s+(Number(f.size)||0), 0) + pendingNewFiles.reduce((s,f) => s+f.size, 0);
    }
    function updateStorageHint(){
      if (!opts.storageHintEl) return;
      const used = clientStorageUsed(opts.clientSelectEl.value, opts.getExcludeId());
      const usedMb = (used/1024/1024).toFixed(2);
      opts.storageHintEl.textContent = `Espacio usado por este cliente (sin contar lo de este formulario): ${usedMb} MB de 15 MB.`;
      opts.storageHintEl.style.color = used >= CLIENT_STORAGE_BUDGET ? 'var(--danger)' : 'var(--muted)';
    }
    function renderFilesList(){
      const rows = [];
      attachments.forEach((f, idx) => rows.push(`<div class="kv" style="align-items:center;">
          <span>📎 ${esc(f.name)} ${f.size ? `(${Math.round(f.size/1024)} KB)` : ''}</span>
          <span class="row-actions">
            <button type="button" class="btn btn-sm btn-outline am-view" data-id="${esc(f.id)}" data-type="${esc(f.type||'')}" data-count="${f.chunkCount||0}">Ver</button>
            <button type="button" class="btn btn-sm btn-danger-outline am-remove" data-kind="existing" data-idx="${idx}">Quitar</button>
          </span></div>`));
      pendingNewFiles.forEach((f, idx) => rows.push(`<div class="kv" style="align-items:center;">
          <span>🆕 ${esc(f.name)} (${Math.round(f.size/1024)} KB)</span>
          <span class="row-actions"><button type="button" class="btn btn-sm btn-danger-outline am-remove" data-kind="pending" data-idx="${idx}">Quitar</button></span></div>`));
      opts.filesListEl.innerHTML = rows.join('') || '<p class="sub" style="margin:4px 0;">Sin archivos adjuntos todavía.</p>';
      opts.filesListEl.querySelectorAll('.am-remove').forEach(b => b.addEventListener('click', () => {
        const idx = Number(b.dataset.idx);
        if (b.dataset.kind === 'existing'){ removedIds.push(attachments[idx].id); attachments.splice(idx, 1); }
        else { pendingNewFiles.splice(idx, 1); }
        renderFilesList();
        updateStorageHint();
      }));
      opts.filesListEl.querySelectorAll('.am-view').forEach(b => b.addEventListener('click', () => {
        viewStoredFile(b.dataset.id, b.dataset.type, Number(b.dataset.count));
      }));
    }
    renderFilesList();
    updateStorageHint();
    opts.clientSelectEl.addEventListener('change', updateStorageHint);

    opts.fileInputEl.addEventListener('change', () => {
      const files = Array.from(opts.fileInputEl.files || []);
      if (!files.length) return;
      const used = clientStorageUsed(opts.clientSelectEl.value, opts.getExcludeId());
      let runningTotal = currentTotalSize();
      const rejected = [];
      files.forEach(f => {
        if (f.size > MAX_FILE_BYTES || used + runningTotal + f.size > CLIENT_STORAGE_BUDGET){
          rejected.push(f.name);
          return;
        }
        runningTotal += f.size;
        const reader = new FileReader();
        reader.onload = () => {
          pendingNewFiles.push({ localId: newFileId(), name: f.name, type: f.type, size: f.size, base64: reader.result });
          renderFilesList();
          updateStorageHint();
        };
        reader.readAsDataURL(f);
      });
      if (rejected.length){
        opts.hintEl.textContent = `No entran en el espacio de 15 MB del cliente: ${rejected.join(', ')}.`;
        opts.hintEl.style.color = 'var(--danger)';
      } else {
        opts.hintEl.textContent = 'Podés elegir varios archivos a la vez, o ir agregando de a uno — no reemplazan a los anteriores.';
        opts.hintEl.style.color = 'var(--muted)';
      }
      opts.fileInputEl.value = '';
    });

    return {
      totalSize: currentTotalSize,
      async finalize(){
        const savedNew = [];
        for (const f of pendingNewFiles){
          let chunkCount;
          try {
            chunkCount = await saveFileChunks(f.localId, f.base64, (done, total) => {
              if (opts.hintEl){ opts.hintEl.textContent = `Subiendo ${f.name}: parte ${done} de ${total}…`; opts.hintEl.style.color = 'var(--muted)'; }
            });
          } catch (e) {
            await deleteFileChunks(f.localId).catch(() => {});
            throw e;
          }
          savedNew.push({ id: f.localId, name: f.name, type: f.type, size: f.size, chunkCount });
        }
        for (const id of removedIds){
          await deleteFileChunks(id).catch(() => {});
        }
        return attachments.concat(savedNew);
      },
    };
  }
  function openDocForm(existing){

    const backdrop = openModal(existing ? 'Editar documento' : 'Nuevo registro de documento', `

      }

    const am = initAttachmentManager({
      initialFiles: docFiles(d),
      clientSelectEl: backdrop.querySelector('#docClientSelect'),
      filesListEl: backdrop.querySelector('#docFilesList'),
      fileInputEl: backdrop.querySelector('#docFileInput'),
      hintEl: backdrop.querySelector('#docFileHint'),
      storageHintEl: backdrop.querySelector('#clientStorageHint'),
      getExcludeId: () => existing ? existing.id : null,
    });
  }
  function dataUrlToBlob(dataUrl){
    const [header, base64] = dataUrl.split(',');
    const mime = (header.match(/data:(.*?);base64/) || [,'application/octet-stream'])[1];
    const bin = atob(base64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  async function viewStoredFile(fileId, fileType, expectedCount){
    try {
      const blob = dataUrlToBlob(await loadFileDataUrl(fileId, fileType, expectedCount));
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { toast('No se pudo abrir el archivo' + (e && e.message ? ': ' + e.message : '.')); }
  }
  async function downloadStoredFile(fileId, fileName, fileType, expectedCount){
    const downloads = await claude.use('downloads');
    if (!downloads){ toast('La descarga no está disponible en esta vista.'); return; }
    try {
      const dataUrl = await loadFileDataUrl(fileId, fileType, expectedCount);
      await downloads.save({ filename: fileName || 'documento', data: dataUrlToBlob(dataUrl) });
    } catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar el archivo' + (e && e.message ? ': ' + e.message : '.')); }
  }
